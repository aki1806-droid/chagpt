<title>Notabene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap">
<style>
/* Layout: barra superiore fissa; benvenuto con statistiche; note in evidenza; colonna filtri + griglia/lista; pannelli laterali per nota e personalizzazione. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#dbe1e6; --line-2:#c7d0d7;
  --fg:#16212a; --muted:#5b6b76; --faint:#8a98a2;
  --a-light:#1d5c6b; --a-dark:#5fb3c4;
  --accent:var(--a-light); --accent-ink:#ffffff;
  --accent-soft:color-mix(in srgb, var(--accent) 13%, var(--surface));
  --accent-line:color-mix(in srgb, var(--accent) 35%, var(--line));
  --mark:#ffe27a; --mark-ink:#16212a;
  --ok:#2f7d4f; --warn:#a96800;
  --c0:#1d5c6b; --c1:#c2513a; --c2:#3d55c4; --c3:#2f7d4f; --c4:#8a3d7e; --c5:#a96800; --c6:#0f7f8f; --c7:#b23b5c; --c8:#5b6b2f; --c9:#5b6b76;
  --shadow-s:0 1px 2px rgb(22 33 42 / .06);
  --shadow:0 1px 2px rgb(22 33 42 / .05), 0 10px 30px rgb(22 33 42 / .09);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --welcome-bg:var(--accent); --welcome-fg:var(--accent-ink);
  --r:12px; --r-s:8px; --pad:16px; --gap:16px; --fs:15px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161b; --surface:#152128; --surface-2:#1a2930; --line:#26363e; --line-2:#33464f;
  --fg:#e4ecef; --muted:#9aabb3; --faint:#71848d; --accent:var(--a-dark); --accent-ink:#0a1317;
  --mark:#7d6300; --mark-ink:#fff5cc; --ok:#62c28d; --warn:#e6aa45;
  --c0:#5fb3c4; --c1:#f08a72; --c2:#8d9eff; --c3:#71c58a; --c4:#d38bc6; --c5:#e6aa45; --c6:#4fc6d4; --c7:#f07a9c; --c8:#b4c46a; --c9:#9aabb3;
  --shadow-s:0 1px 2px rgb(0 0 0 / .3); --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .4);
  --welcome-bg:color-mix(in srgb, var(--accent) 32%, var(--surface)); --welcome-fg:var(--fg);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161b; --surface:#152128; --surface-2:#1a2930; --line:#26363e; --line-2:#33464f;
  --fg:#e4ecef; --muted:#9aabb3; --faint:#71848d; --accent:var(--a-dark); --accent-ink:#0a1317;
  --mark:#7d6300; --mark-ink:#fff5cc; --ok:#62c28d; --warn:#e6aa45;
  --c0:#5fb3c4; --c1:#f08a72; --c2:#8d9eff; --c3:#71c58a; --c4:#d38bc6; --c5:#e6aa45; --c6:#4fc6d4; --c7:#f07a9c; --c8:#b4c46a; --c9:#9aabb3;
  --shadow-s:0 1px 2px rgb(0 0 0 / .3); --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .4);
  --welcome-bg:color-mix(in srgb, var(--accent) 32%, var(--surface)); --welcome-fg:var(--fg);
  color-scheme:dark}

/* Colori principali scelti dall'utente */
:root[data-accent="corallo"]{--a-light:#c2513a; --a-dark:#f08a72}
:root[data-accent="indaco"]{--a-light:#3d55c4; --a-dark:#8d9eff}
:root[data-accent="bosco"]{--a-light:#2f7d4f; --a-dark:#71c58a}
:root[data-accent="prugna"]{--a-light:#8a3d7e; --a-dark:#d38bc6}
:root[data-accent="ambra"]{--a-light:#9a6200; --a-dark:#e6aa45}
:root[data-accent="grafite"]{--a-light:#34424c; --a-dark:#b9c6cf}

/* Caratteri */
:root[data-font="editoriale"]{--display:"Newsreader", Georgia, "Times New Roman", serif}
:root[data-font="tecnico"]{--display:"IBM Plex Mono", ui-monospace, Menlo, monospace; --body:"IBM Plex Sans", system-ui, sans-serif}
/* Forma e densità */
:root[data-radius="squadrati"]{--r:4px; --r-s:3px}
:root[data-radius="morbidi"]{--r:20px; --r-s:12px}
:root[data-density="compatta"]{--pad:11px; --gap:10px}
:root[data-density="ariosa"]{--pad:20px; --gap:22px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:var(--fs);line-height:1.5}
:root[data-bg="puntini"] body{background-image:radial-gradient(var(--line-2) 1px, transparent 1.2px);background-size:22px 22px}
:root[data-bg="aurora"] body{background-image:radial-gradient(900px 420px at 12% -10%, var(--accent-soft), transparent 70%), radial-gradient(700px 380px at 95% 0%, color-mix(in srgb, var(--c1) 12%, transparent), transparent 70%);background-repeat:no-repeat}
:root[data-bg="righe"] body{background-image:repeating-linear-gradient(var(--bg) 0 31px, var(--line) 31px 32px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Barra superiore */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .nb{font-family:var(--mono);font-size:10.5px;font-weight:500;border:1.5px solid var(--accent);color:var(--accent);border-radius:4px;padding:1px 4px;transform:rotate(-7deg)}
.search{flex:1 1 260px;min-width:0;position:relative;display:block}
.search input{width:100%;padding:10px 44px 10px 40px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.search input:focus{background:var(--surface);border-color:var(--accent-line)}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.actions{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:8px 12px;font-weight:500;transition:background .15s,border-color .15s,transform .1s;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:color-mix(in srgb, var(--accent) 88%, var(--fg))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{padding:8px}
.btn[disabled]{opacity:.6;cursor:default}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.menu{position:fixed;right:16px;top:calc(62px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:240px;max-width:calc(100% - 32px);padding:6px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:9px 10px;border-radius:6px}
.menu button:hover{background:var(--surface-2)}
.menu .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}

/* Struttura */
.page{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
.welcome{background:var(--welcome-bg);color:var(--welcome-fg);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;position:relative;overflow:hidden;min-width:0}
.welcome::after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;border:38px solid color-mix(in srgb, var(--welcome-fg) 9%, transparent)}
.welcome .date{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.welcome h1{font-family:var(--display);font-size:clamp(26px,3.4vw,38px);line-height:1.08;margin:6px 0 0;letter-spacing:-.02em;text-wrap:balance}
.welcome p{margin:0;opacity:.9;max-width:52ch}
.welcome .row{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.welcome .btn{background:color-mix(in srgb, var(--welcome-fg) 12%, transparent);border-color:color-mix(in srgb, var(--welcome-fg) 25%, transparent);color:var(--welcome-fg)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--faint)}
.stat.warn .v{color:var(--warn)}
button.stat{cursor:pointer;color:var(--fg)}
button.stat:hover{border-color:var(--accent-line)}

.section-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.section-h h2{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em}
.section-h .hint{font-size:13px;color:var(--muted)}
.pins{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,300px);gap:var(--gap);overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.pins .card{scroll-snap-align:start}

.wrap{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;align-items:start}
aside{display:flex;flex-direction:column;gap:22px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.flist{display:flex;flex-direction:column;gap:2px}
.flist button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:none;padding:6px 10px;border-radius:var(--r-s);text-align:left;color:var(--fg)}
.flist button:hover{background:var(--surface)}
.flist button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.flist .n{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.flist .nm{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--fg)}
.chip:hover{border-color:var(--line-2)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.toolbar .left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.toolbar h2{font-family:var(--display);font-size:24px;margin:0;letter-spacing:-.02em}
.toolbar .sub{color:var(--muted);font-size:13.5px}
.toolbar .sub b{color:var(--fg);font-variant-numeric:tabular-nums}
.toolbar .right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r-s) + 3px);padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:var(--r-s);font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.icons button{padding:6px 8px}
select.btn{padding-right:28px}

/* Schede */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--gap)}
.grid.list{grid-template-columns:minmax(0,1fr);gap:8px}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);padding-top:calc(var(--pad) + 4px);display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;cursor:pointer;transition:border-color .15s, transform .15s, box-shadow .15s;color:var(--fg);overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--band, var(--line))}
.card:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow)}
.card.tinted{background:color-mix(in srgb, var(--band) 7%, var(--surface))}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);gap:8px}
.type{display:inline-flex;align-items:center;gap:6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.type .i{width:15px;height:15px}
.card h4{margin:0;font-size:16px;line-height:1.3;font-weight:600;padding-right:26px;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.star{position:absolute;top:calc(var(--pad) + 18px);right:10px;border:none;background:none;padding:4px;color:var(--faint);border-radius:6px}
.star:hover{color:var(--warn);background:var(--surface-2)}
.star.on{color:var(--warn)}
.star.on .i{fill:currentColor}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
.foot .vis{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:600;white-space:nowrap}
.pill.ai{background:var(--accent-soft);color:var(--accent)}
.pill.rev{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.snippet{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-left:3px solid var(--mark);padding:4px 8px;border-radius:4px;overflow-wrap:anywhere}
.grid.list .card{flex-direction:row;align-items:center;gap:14px;padding-top:var(--pad);padding-left:calc(var(--pad) + 6px)}
.grid.list .card::before{inset:0 auto 0 0;width:4px;height:auto}
.grid.list .card p,.grid.list .card .tags,.grid.list .snippet{display:none}
.grid.list .card .meta{order:3;flex:none}
.grid.list .card h4{flex:1;padding-right:0}
.grid.list .card .foot{order:2;margin:0;padding:0;flex:none;max-width:40%}
.grid.list .star{position:static;order:4}
.grid.compact .card p{-webkit-line-clamp:2}
.grid.compact .card .tags{display:none}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface)}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--fg);margin-bottom:4px}
.loading{grid-column:1/-1;color:var(--muted);padding:32px 0;text-align:center}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r);padding:10px 14px;font-size:14px}

/* Pannelli */
.scrim{position:fixed;inset:0;background:rgb(8 16 20 / .4);z-index:35;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slide .2s ease-out}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.drawer .db{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.drawer .band{height:6px;background:var(--band,var(--accent))}
.ttl{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;border:1px solid transparent;border-radius:var(--r-s);padding:4px 6px;margin:-4px -6px;width:calc(100% + 12px);background:transparent;line-height:1.2}
.ttl:hover{border-color:var(--line)}
.ttl:focus{border-color:var(--accent-line);background:var(--surface-2);outline:none}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px}
.lbl5{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.tagedit .tag{display:inline-flex;gap:6px;align-items:center}
.tagedit .tag button{border:none;background:none;padding:0;color:var(--muted);line-height:1}
.addtag{border:1px dashed var(--line-2);background:none;border-radius:5px;padding:1px 8px;font-size:12px;width:130px}
.full{white-space:pre-wrap;font-size:13.5px;max-height:340px;overflow:auto}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);background:var(--c);padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--fg)}
.sw.none{background:repeating-linear-gradient(45deg,var(--surface-2) 0 4px,var(--line) 4px 6px)}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:13px;color:var(--muted)}
.input{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:9px 11px;width:100%}
.input:focus{border-color:var(--accent-line);outline:none}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 11px;font-size:13.5px;color:var(--fg)}
.choices button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;padding:4px 0}
.toggle input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(17px)}
.catrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.catrow .swatches{gap:5px}
.catrow .sw{width:20px;height:20px}
.preview{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;height:44px}
.preview i{display:block}

.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.modal .panel{background:var(--surface);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow);width:min(560px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;animation:pop .18s ease-out}
.modal h2{font-family:var(--display);margin:0;font-size:22px}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{flex:1 1 180px;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio small{display:block;color:var(--muted)}
textarea.input{min-height:150px;resize:vertical;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r-s);font-size:14px;z-index:70;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:toastin .18s ease-out}

@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:.5}}
@keyframes toastin{from{transform:translate(-50%,8px);opacity:.4}}

.mfilters{display:none}
@media (max-width:980px){ .hero{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{display:none;position:static} aside.open{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .mfilters{display:inline-flex}
  .hide-s{display:none}
  .search kbd{display:none}
  .grid.list .card .foot{display:none}
}
@media (max-width:480px){ .stats .stat .v{font-size:24px} .welcome{padding:18px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ---------- Dati e impostazioni ---------- */
const TYPES = {
  plaud:{l:"Plaud", c:"--c4"}, audio:{l:"Audio", c:"--c4"}, doc:{l:"Documento", c:"--c0"},
  pdf:{l:"PDF", c:"--c1"}, img:{l:"Foto", c:"--c2"}, txt:{l:"Testo", c:"--c9"}, altro:{l:"Altro", c:"--c9"}
};
const ACCENTS = [["petrolio","#1d5c6b"],["corallo","#c2513a"],["indaco","#3d55c4"],["bosco","#2f7d4f"],["prugna","#8a3d7e"],["ambra","#9a6200"],["grafite","#34424c"]];
const DEFAULTS = {
  nome:"", tema:"auto", accento:"petrolio", font:"moderno", sfondo:"tinta", angoli:"arrotondati", densita:"comoda", testo:15,
  benvenuto:true, statistiche:true, evidenza:true, schedeColorate:false, sezione:"mie", vista:"griglia", ordine:"recenti", catColors:{}
};
let P = Object.assign({}, DEFAULTS);
let NOTES = [], ME = "", BOOT = {};
let S = {scope:"mie", cat:null, type:null, tag:null, q:"", open:null, hits:{}};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD = d => d ? new Date(d+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}) : "";
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const icon = (id, cls) => `<svg class="i ${cls||""}"><use href="#${id}"/></svg>`;

function api(fn, ...args) {
  if (window.NB_DEMO) return Promise.resolve().then(() => window.NB_DEMO[fn](...args));
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function fail(e){ toast(String(e && e.message || e)); }

/* ---------- Aspetto ---------- */
function applyPrefs(){
  const r = document.documentElement;
  if (P.tema === "auto") { if (applyPrefs.touched) r.removeAttribute("data-theme"); }
  else r.setAttribute("data-theme", P.tema);
  const set = (k, v, def) => v === def ? r.removeAttribute(k) : r.setAttribute(k, v);
  set("data-accent", P.accento, "petrolio");
  set("data-font", P.font, "moderno");
  set("data-bg", P.sfondo, "tinta");
  set("data-radius", P.angoli, "arrotondati");
  set("data-density", P.densita, "comoda");
  r.style.setProperty("--fs", P.testo + "px");
}
let saveTimer;
function savePrefs(){
  applyPrefs.touched = true;
  applyPrefs();
  store("nb-prefs", JSON.stringify(P));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => api("savePrefs", P).catch(()=>{}), 600);
}
function catColor(cat){
  if (!cat) return "var(--c9)";
  if (P.catColors[cat] != null) return `var(--c${P.catColors[cat]})`;
  let h = 0; for (const ch of cat) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `var(--c${h % 9})`;
}
function noteColor(n){ return n.colore !== "" && n.colore != null ? `var(--c${n.colore})` : catColor(n.categoria); }

/* ---------- Disegno ---------- */
function hl(text){
  const t = esc(text); if(!S.q.trim()) return t;
  const words = S.q.trim().split(/\s+/).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(Boolean);
  return t.replace(new RegExp("("+words.join("|")+")","gi"),"<mark>$1</mark>");
}
function inScope(n){ return S.scope === "tutte" || n.sezione === S.scope; }
function matches(n){
  if(S.cat && n.categoria!==S.cat) return false;
  if(S.type && n.tipo!==S.type) return false;
  if(S.tag && !n.etichette.includes(S.tag)) return false;
  const q = S.q.trim().toLowerCase();
  if(!q) return true;
  if(S.hits[n.id]) return true;
  const hay = [n.titolo,n.riassunto,n.categoria,n.etichette.join(" "),n.percorso].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
function count(list,key){ const m={}; list.forEach(n=>{ (Array.isArray(n[key])?n[key]:[n[key]]).forEach(v=>{ if(v) m[v]=(m[v]||0)+1; })}); return m; }
const SORTS = {
  recenti:(a,b)=>String(b.data).localeCompare(String(a.data)),
  vecchie:(a,b)=>String(a.data).localeCompare(String(b.data)),
  titolo:(a,b)=>String(a.titolo).localeCompare(String(b.titolo),"it"),
  categoria:(a,b)=>String(a.categoria).localeCompare(String(b.categoria),"it") || String(b.data).localeCompare(String(a.data))
};

function render(){
  renderHero();
  const base = NOTES.filter(inScope);
  const res = base.filter(matches).sort(SORTS[P.ordine] || SORTS.recenti);
  $("#h2").textContent = {mie:"Le mie note", team:"Condivise", tutte:"Tutte le note"}[S.scope];
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on", b.dataset.s===S.scope));
  document.querySelectorAll("#views button").forEach(b=>b.classList.toggle("on", b.dataset.v===P.vista));
  $("#sort").value = P.ordine;
  $("#sub").innerHTML = `<b>${res.length}</b> di <b>${base.length}</b>` + (S.q?` per «${esc(S.q)}»`:"");
  const cc = count(base,"categoria"), tc = count(base,"tipo"), gc = count(base,"etichette");
  $("#cats").innerHTML = `<button class="${!S.cat?"on":""}" data-cat=""><span class="nm">Tutte</span><span class="n">${base.length}</span></button>` +
    Object.keys(cc).sort((a,b)=>a.localeCompare(b,"it")).map(c=>`<button class="${S.cat===c?"on":""}" data-cat="${esc(c)}"><span class="nm"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</span><span class="n">${cc[c]}</span></button>`).join("");
  $("#types").innerHTML = Object.keys(TYPES).filter(k=>tc[k]).map(k=>`<button class="${S.type===k?"on":""}" data-type="${k}"><span class="nm">${icon("i-t-"+(k==="altro"?"txt":k))}${TYPES[k].l}</span><span class="n">${tc[k]}</span></button>`).join("");
  $("#tags").innerHTML = Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,24).map(([g])=>`<button class="chip ${S.tag===g?"on":""}" data-tag="${esc(g)}">${esc(g)}</button>`).join("");
  const grid = $("#grid");
  grid.className = "grid" + (P.vista==="lista"?" list":P.vista==="compatta"?" compact":"");
  grid.innerHTML = res.length ? res.map(card).join("") : emptyState(base.length);
  const pins = NOTES.filter(n=>n.preferita).sort(SORTS.recenti);
  $("#pinsec").hidden = !P.evidenza || !pins.length;
  $("#pins").innerHTML = pins.map(card).join("");
}
function greeting(){
  const h = new Date().getHours();
  return h < 6 ? "Buonanotte" : h < 13 ? "Buongiorno" : h < 18 ? "Buon pomeriggio" : "Buonasera";
}
function renderHero(){
  const hero = $("#hero");
  hero.hidden = !P.benvenuto && !P.statistiche;
  hero.style.gridTemplateColumns = P.benvenuto && P.statistiche ? "" : "minmax(0,1fr)";
  const weekAgo = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
  const week = NOTES.filter(n => n.data >= weekAgo).length;
  const rev = NOTES.filter(n => n.stato === "da rivedere").length;
  const plaud = NOTES.filter(n => n.tipo === "plaud").length;
  const team = NOTES.filter(n => n.sezione === "team").length;

      <div><div class="date">${esc(today)}</div>
      <h1>${greeting()}${P.nome?", "+esc(P.nome):""}</h1></div>
      <p>${rev ? `Hai <b>${rev}</b> ${rev===1?"nota da rivedere":"note da rivedere"}: l'AI non era sicura di categoria o etichette.` : "Tutte le note sono catalogate. Cerca, filtra o aggiungine una nuova."}</p>
      <div class="row"><button class="btn" data-act="new">${icon("i-plus")}Nuova nota</button>${rev?`<button class="btn" data-act="review">Rivedi ora</button>`:""}<button class="btn" data-act="custom">${icon("i-palette")}Personalizza</button></div>

      <button class="stat" data-act="all"><span class="k">Note in archivio</span><span class="v">${NOTES.length}</span><span class="s">${NOTES.length - team} personali · ${team} condivise</span></button>

}
function emptyState(total){
  if (total) return `<div class="empty"><b>Nessun risultato</b>Prova a togliere un filtro o a cercare un'altra parola.</div>`;
  return `<div class="empty"><b>Sezione vuota</b>Crea una nota con «Nuova nota» oppure mettila nella cartella Drive

function card(n){
  const T = TYPES[n.tipo] || TYPES.altro;

    <div class="meta"><span class="type">${icon("i-t-"+(n.tipo==="altro"?"txt":n.tipo))}${T.l}</span><span>${fmtD(n.data)}</span></div>
    <button class="star ${n.preferita?"on":""}" data-star="${esc(n.id)}" aria-label="${n.preferita?"Togli dall'evidenza":"Metti in evidenza"}">${icon("i-star")}</button>

/* ---------- Nota aperta ---------- */
function openNote(id){
  const n = NOTES.find(x=>x.id===id); if(!n) return; S.open=id;
  const T = TYPES[n.tipo] || TYPES.altro;
  const cats = Object.keys(count(NOTES,"categoria")).sort();
  $("#layer").innerHTML = `<div class="scrim" data-close></div>
  <section class="drawer" role="dialog" aria-label="${esc(n.titolo)}" style="--band:${noteColor(n)}">
    <div class="band"></div>
    <div class="dh"><span class="type" style="font-family:var(--mono);font-size:12px">${icon("i-t-"+(n.tipo==="altro"?"txt":n.tipo))}${T.l} · ${fmtD(n.data)}</span>
      <div style="display:flex;gap:4px"><button class="btn icon ghost star ${n.preferita?"on":""}" style="position:static" data-star="${esc(n.id)}" aria-label="In evidenza">${icon("i-star")}</button>
      <button class="btn icon ghost" data-close aria-label="Chiudi">${icon("i-close")}</button></div></div>
    <div class="db">
      <input class="ttl" id="ttl" value="${esc(n.titolo)}" aria-label="Titolo">
      <div class="box"><div class="lbl5">Riassunto ${n.stato==="da rivedere"?'<span class="pill rev">Da rivedere</span>':""}</div><div>${hl(n.riassunto)}</div></div>
      <div><div class="lbl5">Etichette</div>
        <div class="tags tagedit">${n.etichette.map(g=>`<span class="tag">${esc(g)}<button data-rmtag="${esc(g)}" aria-label="Rimuovi ${esc(g)}">×</button></span>`).join("")}
        <input class="addtag" id="addtag" placeholder="+ etichetta, Invio"></div></div>
      <label class="field"><span>Categoria</span>
        <input id="cat" class="input" list="catlist" value="${esc(n.categoria)}"><datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
      <div><div class="lbl5">Colore della nota</div>
        <div class="swatches">${swatch("", n.colore===""||n.colore==null, "Colore della categoria", "data-ncol")}${[0,1,2,3,4,5,6,7,8].map(i=>swatch(i, String(n.colore)===String(i), "Colore "+(i+1), "data-ncol")).join("")}</div></div>
      <dl class="box kv"><dt>Sezione</dt><dd>${n.sezione==="team"?"Condivisa con il team":"Personale, solo tu"}</dd><dt>Proprietario</dt><dd>${esc(n.autore)}</dd><dt>Percorso</dt><dd>${esc(n.percorso)}</dd></dl>
      <div class="box"><div class="lbl5">Testo completo</div><div class="full" id="full"><button class="btn" data-text>Mostra il testo</button></div></div>

        <button class="btn" data-move>${icon(n.sezione==="team"?"i-lock":"i-share")}${n.sezione==="team"?"Rendi personale":"Condividi con il team"}</button>
        ${n.stato!=="confermata"?`<button class="btn" data-ok>Conferma catalogazione</button>`:""}
        <a class="btn primary" href="${esc(n.url)}" target="_blank" rel="noopener">Apri in Drive</a>
      </div>
    </div></section>`;
}
function swatch(v, on, label, attr){
  return `<button class="sw ${v===""?"none":""} ${on?"on":""}" style="--c:${v===""?"transparent":`var(--c${v})`}" ${attr}="${v}" aria-label="${esc(label)}" title="${esc(label)}"></button>`;
}
function closeLayer(){ $("#layer").innerHTML=""; S.open=null; }
function save(n, changes){ return api("updateNote", n.id, changes).catch(fail); }
function toggleStar(id){
  const n = NOTES.find(x=>x.id===id); if(!n) return;
  n.preferita = !n.preferita; render(); if (S.open===id) openNote(id);
  save(n, {preferita:n.preferita}); toast(n.preferita?"Messa in evidenza":"Tolta dall'evidenza");
}

/* ---------- Nuova nota ---------- */
function upload(){
  $("#layer").innerHTML = `<div class="scrim" data-close></div><div class="modal"><div class="panel" role="dialog" aria-label="Nuova nota">
    <h2>Nuova nota</h2>
    <div class="seg" id="upmode"><button data-m="file" class="on">Carica un file</button><button data-m="scrivi">Scrivi</button></div>
    <div id="m-file"><div class="drop" id="drop"><input type="file" id="file" hidden>
      <div>Trascina qui un file oppure</div><button class="btn" id="pick">Scegli dal dispositivo</button>
      <div style="font-size:13px">Documenti, PDF, foto, audio. Massimo 20 MB.</div></div></div>
    <div id="m-scrivi" hidden style="display:flex;flex-direction:column;gap:10px">
      <input class="input" id="wtitle" placeholder="Titolo (facoltativo)">
      <textarea class="input" id="wtext" placeholder="Scrivi la nota. L'AI la catalogherà da sola."></textarea>
      <button class="btn primary" id="wsave" style="align-self:flex-end">Salva nota</button></div>
    <div class="radio">
      <label><input type="radio" name="v" value="mie" ${S.scope!=="team"?"checked":""}> <span>Personale<small>La vedi solo tu</small></span></label>
      <label><input type="radio" name="v" value="team" ${S.scope==="team"?"checked":""}> <span>Condivisa<small>La vede tutto il team</small></span></label>
    </div>
    <p id="upmsg" style="margin:0;color:var(--muted)" hidden>Salvataggio su Drive, lettura del testo e catalogazione con l'AI…</p>
    <div style="display:flex;justify-content:flex-end"><button class="btn ghost" data-close>Annulla</button></div>
  </div></div>`;
  $("#m-scrivi").hidden = true;
  const f=$("#file"), d=$("#drop");
  $("#upmode").onclick = e => { const b=e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#upmode button").forEach(x=>x.classList.toggle("on", x===b));
    $("#m-file").hidden = b.dataset.m!=="file"; $("#m-scrivi").hidden = b.dataset.m!=="scrivi"; if(b.dataset.m==="scrivi") $("#wtext").focus(); };
  $("#pick").onclick=()=>f.click();
  f.onchange=()=>f.files[0]&&sendFile(f.files[0]);
  d.ondragover=e=>{e.preventDefault();d.classList.add("over")};
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over");e.dataTransfer.files[0]&&sendFile(e.dataTransfer.files[0])};
  $("#wsave").onclick=()=>{
    const text=$("#wtext").value.trim(); if(!text) return toast("Scrivi qualcosa prima di salvare.");
    const title=($("#wtitle").value.trim() || text.split("\n")[0].slice(0,60)).replace(/[\\/:*?"<>|]/g,"-");
    const bytes = new TextEncoder().encode(text); let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
    sendData(title + ".txt", "text/plain", btoa(bin));
  };
}
function scopeChoice(){ return document.querySelector('input[name="v"]:checked').value; }
function sendFile(file){
  if (file.size > 20*1024*1024) return toast("Il file supera 20 MB: caricalo direttamente nella cartella Drive.");
  const r = new FileReader();
  r.onload = () => sendData(file.name, file.type, String(r.result).split(",")[1]);
  r.readAsDataURL(file);
}
async function sendData(name, type, b64){
  const scope = scopeChoice();
  $("#upmsg").hidden = false;
  try {
    const n = await api("uploadNote", name, type, b64, scope);
    NOTES.unshift(n); S.scope = scope; S.cat=S.type=S.tag=null;
    closeLayer(); render(); toast("Nota salvata e catalogata"); openNote(n.id);
  } catch(e){ $("#upmsg").hidden = true; fail(e); }
}

/* ---------- Avvio ---------- */
async function load(){
  try {
    BOOT = await api("getBootstrap");
    ME = BOOT.email;
    if (BOOT.prefs) { P = Object.assign({}, DEFAULTS, BOOT.prefs); store("nb-prefs", JSON.stringify(P)); applyPrefs(); }
    NOTES = [...BOOT.personal, ...BOOT.team];
    $("#av").textContent = (P.nome || ME).slice(0,2).toUpperCase();
    banner(); render();
  } catch(e){ $("#grid").innerHTML = `<div class="empty"><b>Non riesco a leggere le cartelle</b>${esc(e.message||e)}</div>`; }
}
function banner(){
  const msgs = [];
  if (!BOOT.aiEnabled) msgs.push(BOOT.isAdmin
    ? `La catalogazione con Claude non è attiva. Incolla la chiave API: <input class="input" id="apikey" type="password" placeholder="sk-ant-…" style="width:min(320px,100%)" autocomplete="off"> <button class="btn primary" id="savekey">Salva chiave</button>`
    : "La catalogazione automatica non è ancora attiva: l'amministratore deve inserire la chiave di Claude.");
  if (!BOOT.syncInstalled) msgs.push(`I file nuovi su Drive vengono letti quando premi Aggiorna. <button class="btn" id="auto">Attiva l'aggiornamento ogni ora</button>`);
  $("#banner").innerHTML = msgs.map(m=>`<div class="banner"><span>${m}</span></div>`).join("");
  $("#banner").hidden = !msgs.length;
  const k = $("#savekey"); if (k) k.onclick = async () => { try { await api("setApiKey", $("#apikey").value); BOOT.aiEnabled = true; banner(); toast("Chiave salvata: premi Aggiorna per catalogare le note"); } catch(e){ fail(e); } };
  const a = $("#auto"); if (a) a.onclick = async () => { try { await api("installSync"); BOOT.syncInstalled = true; banner(); toast("Aggiornamento automatico attivo"); } catch(e){ fail(e); } };
}

/* ---------- Eventi ---------- */
let searchTimer;
$("#q").addEventListener("input",e=>{
  S.q=e.target.value; S.hits={}; render();
  clearTimeout(searchTimer);
  if (S.q.trim().length < 3) return;
  const q = S.q;
  searchTimer = setTimeout(async () => {
    try { const r = await api("searchText", q); if (q !== S.q) return; r.forEach(h => S.hits[h.id] = h.estratto); render(); } catch(e){}
  }, 450);
});
$("#seg").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; S.scope=b.dataset.s; S.cat=S.type=S.tag=null; render();});
$("#views").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; P.vista=b.dataset.v; savePrefs(); render();});
$("#sort").addEventListener("change",e=>{P.ordine=e.target.value; savePrefs(); render();});
$("#side").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if("cat" in b.dataset) S.cat=b.dataset.cat||null;
  if(b.dataset.type) S.type = S.type===b.dataset.type?null:b.dataset.type;
  if(b.dataset.tag) S.tag = S.tag===b.dataset.tag?null:b.dataset.tag;
  render();
});
function onCards(e){
  const st=e.target.closest("[data-star]"); if(st){ e.stopPropagation(); return toggleStar(st.dataset.star); }
  const c=e.target.closest("[data-open]"); if(c) openNote(c.dataset.open);
}
$("#grid").addEventListener("click",onCards);
$("#pins").addEventListener("click",onCards);
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches && e.target.matches(".card")) openNote(e.target.dataset.open); });
$("#hero").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="new") upload();
  if(a==="custom") openCustom();

});
$("#up").onclick=upload;
$("#custom").onclick=openCustom;
$("#sync").onclick=async()=>{
  const b=$("#sync"); b.disabled=true; toast("Aggiornamento in corso…");

$("#av").onclick=()=>{

};
$("#menu").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; $("#menu").hidden=true; if(b.dataset.m==="custom") openCustom(); if(b.dataset.m==="sync") $("#sync").click(); });
document.addEventListener("click",e=>{ if(!e.target.closest("#menu,#av")) $("#menu").hidden=true; });

$("#layer").addEventListener("click",async e=>{
  if(e.target.closest("[data-close]")) return closeLayer();
  // Personalizza
  const pc = e.target.closest("[data-pref] [data-v]");
  if (pc) { const key = pc.closest("[data-pref]").dataset.pref; const v = pc.dataset.v; P[key] = key==="testo" ? Number(v) : v; savePrefs(); render(); return openCustom(); }
  const cc = e.target.closest("[data-catcol] [data-v]");
  if (cc) { P.catColors = Object.assign({}, P.catColors, {[cc.closest("[data-catcol]").dataset.catcol]: Number(cc.dataset.v)}); savePrefs(); render(); return openCustom(); }
  if (e.target.closest("[data-reset]")) { P = Object.assign({}, DEFAULTS, {nome:P.nome}); savePrefs(); render(); toast("Impostazioni ripristinate"); return openCustom(); }
  // Nota
  const n=NOTES.find(x=>x.id===S.open); if(!n) return;
  const st=e.target.closest("[data-star]"); if(st) return toggleStar(n.id);
  const nc=e.target.closest("[data-ncol]");
  if(nc){ n.colore = nc.dataset.ncol===""?"":Number(nc.dataset.ncol); render(); openNote(n.id); save(n,{colore:n.colore}); return; }
  const rm=e.target.closest("[data-rmtag]");
  if(rm){ n.etichette=n.etichette.filter(g=>g!==rm.dataset.rmtag); render(); openNote(n.id); save(n,{etichette:n.etichette}); }
  if(e.target.closest("[data-ok]")){ n.stato="confermata"; render(); openNote(n.id); save(n,{conferma:true, etichette:n.etichette, categoria:n.categoria}); toast("Catalogazione confermata"); }
  if(e.target.closest("[data-text]")){ $("#full").textContent="Caricamento…"; try { $("#full").textContent = (await api("getNoteText", n.id)) || "Nessun testo estratto."; } catch(err){ fail(err); } }
  if(e.target.closest("[data-move]")){
    const to = n.sezione==="team"?"mie":"team";
    try { await api("moveNote", n.id, to); n.sezione=to; render(); openNote(n.id); toast(to==="team"?"Ora la vede tutto il team":"Ora la vedi solo tu"); } catch(err){ fail(err); }
  }
});
$("#layer").addEventListener("change",e=>{
  if (e.target.matches("[data-tog]")) { P[e.target.dataset.tog] = e.target.checked; savePrefs(); render(); return; }
  if (e.target.id==="pnome") { P.nome = e.target.value.trim(); savePrefs(); $("#av").textContent=(P.nome||ME).slice(0,2).toUpperCase(); render(); toast("Nome salvato"); return; }
  const n=NOTES.find(x=>x.id===S.open); if(!n) return;
  if (e.target.id==="ttl") { const v=e.target.value.trim(); if(v && v!==n.titolo){ n.titolo=v; render(); save(n,{titolo:v}); toast("Titolo aggiornato"); } }
  if (e.target.id==="cat") { const v=e.target.value.trim(); if(v && v!==n.categoria){ n.categoria=v; render(); openNote(n.id); save(n,{categoria:v}); toast("Categoria aggiornata"); } }
});
$("#layer").addEventListener("keydown",e=>{
  const n=NOTES.find(x=>x.id===S.open);
  if(e.key==="Enter" && (e.target.id==="ttl"||e.target.id==="cat"||e.target.id==="pnome")) { e.target.blur(); return; }
  if(n && e.target.id==="addtag" && e.key==="Enter"){ const v=e.target.value.trim().toLowerCase();
    if(v && !n.etichette.includes(v)){ n.etichette.push(v); render(); openNote(n.id); save(n,{etichette:n.etichette}); setTimeout(()=>$("#addtag")?.focus(),0);} }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLayer(); if(e.key==="/" && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); } });

try { const saved = JSON.parse(store("nb-prefs") || "null"); if (saved) P = Object.assign({}, DEFAULTS, saved); } catch(e){}
S.scope = P.sezione;
applyPrefs();
load();
</script>
