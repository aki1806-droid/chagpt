<style>
/* Layout: barra superiore con ricerca, colonna filtri a sinistra, griglia di schede, pannello dettaglio a destra. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --line:#d9dfe3;
  --fg:#17232a; --muted:#5a6b74; --accent:#1d5c6b; --accent-ink:#ffffff; --accent-soft:#dcebee;
  --mark:#ffe58a; --mark-ink:#17232a;
  --ok:#2f7d4f; --warn:#a66a00; --audio:#7a4ea8; --pdf:#b23b3b; --img:#2f6fb0; --doc:#1d5c6b; --txt:#5a6b74;
  --shadow:0 1px 2px rgb(23 35 42 / .06), 0 8px 24px rgb(23 35 42 / .08);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#162227; --surface-2:#1b2a30; --line:#2a3b42;
  --fg:#e3ebee; --muted:#97a9b1; --accent:#5fb3c4; --accent-ink:#0b1417; --accent-soft:#1e3a42;
  --mark:#8a6d00; --mark-ink:#fff6d0;
  --ok:#5fc08a; --warn:#e0a640; --audio:#b893e0; --pdf:#ee7b7b; --img:#79aee6; --doc:#5fb3c4; --txt:#97a9b1;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#162227; --surface-2:#1b2a30; --line:#2a3b42;
  --fg:#e3ebee; --muted:#97a9b1; --accent:#5fb3c4; --accent-ink:#0b1417; --accent-soft:#1e3a42;
  --mark:#8a6d00; --mark-ink:#fff6d0;
  --ok:#5fc08a; --warn:#e0a640; --audio:#b893e0; --pdf:#ee7b7b; --img:#79aee6; --doc:#5fb3c4; --txt:#97a9b1;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}

.demo{background:var(--accent-soft);color:var(--fg);font-size:13px;padding:6px 16px;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .nb{font-family:var(--mono);font-size:11px;font-weight:500;border:1.5px solid var(--accent);color:var(--accent);border-radius:4px;padding:1px 4px;transform:rotate(-6deg)}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent);border:none}
.menu{position:absolute;right:16px;top:58px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:240px;padding:6px;z-index:30}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--surface-2)}
.menu .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}

.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding-block:20px;padding-inline:16px;max-width:1320px;margin:0 auto}
aside{display:flex;flex-direction:column;gap:22px}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.flist{display:flex;flex-direction:column;gap:2px}
.flist button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:none;padding:6px 10px;border-radius:6px;text-align:left}
.flist button:hover{background:var(--surface)}
.flist button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.flist .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 14px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.head h1{font-family:var(--display);font-size:28px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.sub b{color:var(--fg);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);gap:8px}
.type{display:inline-flex;align-items:center;gap:6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.type i{width:9px;height:9px;border-radius:2px;display:inline-block}
.card h4{margin:0;font-size:16px;line-height:1.3;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
.vis{display:inline-flex;align-items:center;gap:5px}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:600}
.pill.ai{background:var(--accent-soft);color:var(--accent)}
.pill.rev{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:8px}
.drawer .db{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.drawer h2{font-family:var(--display);font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.box h5{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.tr p{margin:0 0 8px;font-size:14px}
.tr .sp{font-family:var(--mono);font-size:11.5px;color:var(--audio);margin-right:6px}
.tagedit .tag{display:inline-flex;gap:6px;align-items:center}
.tagedit .tag button{border:none;background:none;padding:0;color:var(--muted);line-height:1}
.addtag{border:1px dashed var(--line);background:none;border-radius:5px;padding:1px 8px;font-size:12px;width:120px}
.scrim{position:fixed;inset:0;background:rgb(10 20 25 / .35);z-index:35}

.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.modal .panel{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal h2{font-family:var(--display);margin:0;font-size:22px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps li.done{color:var(--fg)} .steps li.done .s{background:var(--ok);border-color:var(--ok)}
.steps li.run .s{border-color:var(--accent);animation:pulse 1s infinite}
.steps .s{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
@keyframes pulse{50%{opacity:.35}}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{flex:1 1 180px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;font-size:14px}
.radio label small{display:block;color:var(--muted)}

.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:16px}
.login .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(400px,100%);padding:30px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.login h1{font-family:var(--display);font-size:34px;margin:0;letter-spacing:-.03em}
.login p{margin:0;color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:70;max-width:calc(100% - 32px)}

.mfilters{display:none}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{display:none} aside.open{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .mfilters{display:inline-flex}
  .actions .lbl-up{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let NOTES = [

];
let S = {user:"tu", scope:"mie", cat:null, type:null, tag:null, q:"", open:null};
let nextId = 100;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD = d => new Date(d+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"});
function hl(text){
  const t = esc(text); if(!S.q.trim()) return t;
  const words = S.q.trim().split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(Boolean);
  return t.replace(new RegExp("("+words.join("|")+")","gi"),"<mark>$1</mark>");
}
function visible(){
  return NOTES.filter(n => n.vis==="team" || n.owner===S.user);
}
function inScope(n){
  if(S.scope==="mie") return n.vis==="mie" && n.owner===S.user;
  if(S.scope==="team") return n.vis==="team";
  return true;
}
function matches(n){
  if(S.cat && n.cat!==S.cat) return false;
  if(S.type && n.type!==S.type) return false;
  if(S.tag && !n.tags.includes(S.tag)) return false;
  const q = S.q.trim().toLowerCase();
  if(!q) return true;
  const hay = [n.t,n.sum,n.cat,n.tags.join(" "),(n.tr||[]).map(x=>x[1]).join(" ")].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
function count(list,key){ const m={}; list.forEach(n=>{ (Array.isArray(n[key])?n[key]:[n[key]]).forEach(v=>m[v]=(m[v]||0)+1)}); return m; }

function render(){
  const base = visible().filter(inScope);

  $("#av").textContent = USERS[S.user].ini;
  $("#h1").textContent = {mie:"Le mie note", team:"Condivise con il team", tutte:"Tutte le note"}[S.scope];
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on", b.dataset.s===S.scope));
  const toRev = base.filter(n=>n.rev).length;
  $("#sub").innerHTML = `<b>${res.length}</b> di <b>${base.length}</b> note` + (S.q?` per «${esc(S.q)}»`:"") +
    (toRev?` · <b>${toRev}</b> da rivedere`:"") + " · cartella Drive collegata: <span style='font-family:var(--mono);font-size:12.5px'>Notabene/</span>";
  // filtri
  const cc = count(base,"cat"), tc = count(base,"type"), gc = count(base,"tags");
  $("#cats").innerHTML = `<button class="${!S.cat?"on":""}" data-cat="">Tutte le categorie <span class="n">${base.length}</span></button>` +
    Object.keys(cc).sort().map(c=>`<button class="${S.cat===c?"on":""}" data-cat="${esc(c)}">${esc(c)} <span class="n">${cc[c]}</span></button>`).join("");
  $("#types").innerHTML = Object.keys(TYPES).filter(k=>tc[k]).map(k=>`<button class="${S.type===k?"on":""}" data-type="${k}"><span><span class="dot" style="background:var(${TYPES[k].c})"></span>${TYPES[k].l}</span><span class="n">${tc[k]}</span></button>`).join("");
  $("#tags").innerHTML = Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,14).map(([g])=>`<button class="chip ${S.tag===g?"on":""}" data-tag="${esc(g)}">${esc(g)}</button>`).join("");
  // schede
  $("#grid").innerHTML = res.length ? res.map(card).join("") :
    `<div class="empty">Nessuna nota trovata. Prova a togliere un filtro o a cercare un'altra parola.</div>`;
}
function card(n){
  const T = TYPES[n.type];
  const extra = n.dur ? n.dur : n.pages ? n.pages+" pag." : n.ocr ? "OCR "+n.ocr : "";
  return `<button class="card" data-open="${n.id}">
    <div class="meta"><span class="type"><i style="background:var(${T.c})"></i>${T.l}</span><span>${extra}</span></div>
    <h4>${hl(n.t)}</h4>
    <p>${hl(n.sum)}</p>
    <div class="tags">${n.tags.map(g=>`<span class="tag">${hl(g)}</span>`).join("")}</div>
    <div class="foot"><span class="vis">${n.vis==="team"?"👥 Team":"🔒 Personale"} · ${esc(USERS[n.owner].name)}</span>
    ${n.rev?'<span class="pill rev">Da rivedere</span>':'<span class="pill ai">AI</span>'}</div>
  </button>`;
}
function openNote(id){
  const n = NOTES.find(x=>x.id===id); if(!n) return; S.open=id;
  const T = TYPES[n.type], mine = n.owner===S.user;
  const tr = n.tr ? `<div class="box tr"><h5>Trascrizione Plaud (estratto)</h5>${n.tr.map(x=>`<p><span class="sp">${esc(x[0])}</span>${hl(x[1])}</p>`).join("")}</div>` : "";
  $("#layer").innerHTML = `<div class="scrim" data-close></div>
  <section class="drawer" role="dialog" aria-label="${esc(n.t)}">
    <div class="dh"><span class="type" style="font-family:var(--mono);font-size:12px"><i style="background:var(${T.c})"></i>${T.l}</span>
      <button class="btn ghost" data-close aria-label="Chiudi">✕</button></div>
    <div class="db">
      <h2>${esc(n.t)}</h2>
      <div class="box"><h5>Riassunto AI ${n.rev?'<span class="pill rev" style="margin-left:6px">Da rivedere</span>':""}</h5><div>${hl(n.sum)}</div></div>
      ${tr}
      <div><h5 style="margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Etichette</h5>
        <div class="tags tagedit">${n.tags.map(g=>`<span class="tag">${esc(g)}${mine||n.vis==="team"?`<button data-rmtag="${esc(g)}" aria-label="Rimuovi ${esc(g)}">×</button>`:""}</span>`).join("")}
        <input class="addtag" id="addtag" placeholder="+ etichetta"></div></div>
      <dl class="box kv"><dt>Categoria</dt><dd>${esc(n.cat)}</dd><dt>Data</dt><dd>${fmtD(n.date)}</dd>
        <dt>Autore</dt><dd>${esc(USERS[n.owner].full)}</dd><dt>Visibilità</dt><dd>${n.vis==="team"?"Condivisa con il team":"Personale, solo l'autore"}</dd>
        <dt>File su Drive</dt><dd>${esc(n.path)}</dd></dl>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${mine?`<button class="btn" data-move>${n.vis==="team"?"Rendi personale":"Condividi con il team"}</button>`:""}
        ${n.rev?`<button class="btn" data-ok>Conferma etichette</button>`:""}
        <button class="btn primary" data-drive>Apri in Drive</button>
      </div>
    </div></section>`;
}
function closeLayer(){ $("#layer").innerHTML=""; S.open=null; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

function upload(){
  $("#layer").innerHTML = `<div class="scrim" data-close></div><div class="modal"><div class="panel" role="dialog" aria-label="Carica nota">
    <h2>Carica una nota</h2>
    <div class="drop" id="drop"><input type="file" id="file" hidden>
      <div>Trascina qui un file oppure <button class="btn" id="pick">scegli dal dispositivo</button></div>
      <div style="font-size:13px;margin-top:6px">Testo, Google Doc, PDF, foto, audio. Le registrazioni Plaud arrivano da sole.</div></div>
    <div class="radio">
      <label><input type="radio" name="v" value="mie" checked> <span>🔒 Personale<small>La vedi solo tu</small></span></label>
      <label><input type="radio" name="v" value="team"> <span>👥 Condivisa<small>La vede tutto il team</small></span></label>
    </div>
    <ul class="steps" id="steps" hidden>
      <li><span class="s"></span>Salvataggio nella cartella Drive</li>
      <li><span class="s"></span>Lettura del contenuto (OCR o trascrizione)</li>
      <li><span class="s"></span>Riassunto, categoria ed etichette con l'AI</li>
    </ul>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" data-close>Annulla</button>
      <button class="btn primary" id="demo">Prova con un file di esempio</button></div>
  </div></div>`;
  const f=$("#file"), d=$("#drop");
  $("#pick").onclick=()=>f.click();
  f.onchange=()=>f.files[0]&&process(f.files[0].name);
  d.ondragover=e=>{e.preventDefault();d.classList.add("over")};
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over");e.dataTransfer.files[0]&&process(e.dataTransfer.files[0].name)};
  $("#demo").onclick=()=>process("riunione-fornitori.m4a");
}
function process(name){
  const vis = document.querySelector('input[name="v"]:checked').value;
  const steps=$("#steps"); steps.hidden=false; $("#demo").disabled=true;
  const li=[...steps.children]; let i=0;
  const tick=()=>{ li.forEach((x,k)=>{x.className=k<i?"done":k===i?"run":""}); if(i++<li.length) setTimeout(tick,700); else finish(); };
  tick();
  function finish(){
    const ext=(name.split(".").pop()||"").toLowerCase();
    const type = ["m4a","mp3","wav","ogg"].includes(ext)?"audio":ext==="pdf"?"pdf":["jpg","jpeg","png","heic","webp"].includes(ext)?"img":["txt","md"].includes(ext)?"txt":"doc";
    const n={id:nextId++,t:name.replace(/\.[^.]+$/,"").replace(/[-_]/g," ").replace(/^./,c=>c.toUpperCase()),type,owner:S.user,vis,cat:"Da classificare",
      tags:["nuova","da rivedere"],date:new Date().toISOString().slice(0,10),rev:true,
      path:`Notabene/${vis==="team"?"Condivise":"Personali/"+S.user}/${name}`,
      sum:"Riassunto simulato: nel prodotto reale qui comparirà il sunto generato dall'AI, con categoria ed etichette proposte da confermare."};
    if(type==="audio"){ n.dur="—"; n.tr=[["Speaker 1","Trascrizione simulata della registrazione."]]; }
    NOTES.unshift(n); S.scope=vis; S.cat=S.type=S.tag=null; closeLayer(); render(); toast("Nota aggiunta e catalogata"); openNote(n.id);
  }
}
function showLogin(){
  $("#layer").innerHTML = `<div class="login"><div class="panel">
    <div class="brand" style="font-size:16px">Notabene <span class="nb">NB</span></div>
    <h1>Accedi</h1><p>Accedi con l'account Google del team. Le tue note personali restano visibili solo a te.</p>
    <button class="gbtn" id="g"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.6h7.1C42.7 36.9 45 31.2 45 24.5z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.6c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.8C8.1 41.1 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2V14H4.5C3 17 2 20.4 2 24s1 7 2.5 10l7.3-5.8z"/><path fill="#EA4335" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.5 2 8.1 6.9 4.5 14l7.3 5.8c1.7-5.2 6.5-9 12.2-9z"/></svg>Accedi con Google</button>
    <label class="check"><input type="checkbox" id="rem" checked> Ricordami su questo dispositivo per 30 giorni</label>
    <label for="who" style="font-size:13px;color:var(--muted)">Simula l'accesso come</label>
    <select id="who" class="btn">${Object.entries(USERS).map(([k,u])=>`<option value="${k}">${esc(u.full)}</option>`).join("")}</select>
  </div></div>`;
  $("#g").onclick=()=>{ S.user=$("#who").value; S.scope="mie"; S.cat=S.type=S.tag=null; closeLayer(); render(); toast("Accesso effettuato come "+USERS[S.user].name); };
}

// eventi
$("#q").addEventListener("input",e=>{S.q=e.target.value; render();});
$("#seg").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; S.scope=b.dataset.s; S.cat=S.type=S.tag=null; render();});
$("#side").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if("cat" in b.dataset) S.cat=b.dataset.cat||null;
  if(b.dataset.type) S.type = S.type===b.dataset.type?null:b.dataset.type;
  if(b.dataset.tag) S.tag = S.tag===b.dataset.tag?null:b.dataset.tag;
  render();
});
$("#grid").addEventListener("click",e=>{const c=e.target.closest("[data-open]"); if(c) openNote(+c.dataset.open);});
$("#up").onclick=upload;
$("#mf").onclick=()=>{const o=$("#side").classList.toggle("open"); $("#mf").setAttribute("aria-expanded",o);};
$("#av").onclick=e=>{
  const m=$("#menu"); m.hidden=!m.hidden;
  m.innerHTML=`<div class="lbl">Connesso come</div><div style="padding:2px 10px 8px;font-weight:600">${esc(USERS[S.user].full)}</div>
  <div class="lbl">Cambia dashboard (demo)</div>${Object.entries(USERS).filter(([k])=>k!==S.user).map(([k,u])=>`<button data-sw="${k}">${esc(u.full)}</button>`).join("")}
  <hr style="border:none;border-top:1px solid var(--line)"><button data-out>Esci</button>`;
};
$("#menu").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; $("#menu").hidden=true;
  if(b.dataset.sw){S.user=b.dataset.sw; S.scope="mie"; S.cat=S.type=S.tag=null; render(); toast("Dashboard di "+USERS[S.user].name);}
  if("out" in b.dataset) showLogin();
});
document.addEventListener("click",e=>{ if(!e.target.closest("#menu,#av")) $("#menu").hidden=true; });
$("#layer").addEventListener("click",e=>{
  if(e.target.closest("[data-close]")) return closeLayer();
  const n=NOTES.find(x=>x.id===S.open); if(!n) return;
  const rm=e.target.closest("[data-rmtag]");
  if(rm){ n.tags=n.tags.filter(g=>g!==rm.dataset.rmtag); render(); openNote(n.id); }
  if(e.target.closest("[data-move]")){ n.vis=n.vis==="team"?"mie":"team"; n.path=n.path.replace(/Notabene\/(Condivise|Personali\/\w+)/, n.vis==="team"?"Notabene/Condivise":"Notabene/Personali/"+n.owner); render(); openNote(n.id); toast(n.vis==="team"?"Ora la vede tutto il team":"Ora la vedi solo tu"); }
  if(e.target.closest("[data-ok]")){ n.rev=false; n.tags=n.tags.filter(g=>g!=="da rivedere"); render(); openNote(n.id); toast("Etichette confermate"); }
  if(e.target.closest("[data-drive]")) toast("Nel prodotto reale si apre il file su Google Drive");
});
$("#layer").addEventListener("keydown",e=>{
  if(e.target.id==="addtag" && e.key==="Enter"){ const v=e.target.value.trim().toLowerCase(); const n=NOTES.find(x=>x.id===S.open);
    if(v && n && !n.tags.includes(v)){ n.tags.push(v); render(); openNote(n.id); setTimeout(()=>$("#addtag")?.focus(),0);} }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLayer(); if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); } });
render();
</script>
