<script>
/* ---------- Dati e impostazioni ---------- */
const SERVER_ME = <?!= JSON.stringify(me) ?>;
const TYPES = {
  plaud:{l:"Plaud"}, vocale:{l:"Nota vocale"}, email:{l:"Email"}, audio:{l:"Audio"}, video:{l:"Video"}, img:{l:"Foto"}, doc:{l:"Documento"}, pdf:{l:"PDF"},
  foglio:{l:"Foglio"}, slide:{l:"Presentazione"}, txt:{l:"Testo"}, archivio:{l:"Archivio"}, altro:{l:"Altro"}
};
const VISUAL = ["img","video","pdf","slide"];           // tipi con anteprima nella scheda
const BIG = 20*1024*1024;                                 // oltre: caricamento diretto su Drive
const PAGE = 60;                                          // schede disegnate alla volta
const typeIcon = (t, cls) => icon("i-t-" + (t==="altro" ? "txt" : (TYPES[t] ? t : "txt")), cls);
const ACCENTS = [["petrolio","#1d5c6b"],["corallo","#c2513a"],["indaco","#3d55c4"],["bosco","#2f7d4f"],["prugna","#8a3d7e"],["ambra","#9a6200"],["grafite","#34424c"]];
const DEFAULTS = {
  nome:"", tema:"auto", accento:"petrolio", font:"moderno", sfondo:"tinta", angoli:"arrotondati", densita:"comoda", testo:15,
  benvenuto:true, statistiche:true, evidenza:true, schedeColorate:false, sezione:"mie", vista:"griglia", ordine:"recenti", catColors:{},
  riepilogo:true, gmail:true
};
let P = Object.assign({}, DEFAULTS);
let NOTES = [], ME = "", BOOT = {};
let S = {scope:"mie", cat:null, type:null, tag:null, q:"", open:null, hits:{}, sel:null, chat:[], shown:PAGE};
const THUMBS = {};                                        // anteprime già scaricate (id → data URI o "")
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD = d => d ? new Date(d+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}) : "";
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const icon = (id, cls) => `<svg class="i ${cls||""}"><use href="#${id}"/></svg>`;

function api(fn, ...args) {
  if (window.NB_DEMO) return Promise.resolve().then(() => window.NB_DEMO[fn](...args));
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function fail(e){ toast(String(e && e.message || e)); }

/* ---------- Aspetto ---------- */
function applyPrefs(){
  const r = document.documentElement;
  if (P.tema === "auto") { if (applyPrefs.touched) r.removeAttribute("data-theme"); }
  else r.setAttribute("data-theme", P.tema);
  const set = (k, v, def) => v === def ? r.removeAttribute(k) : r.setAttribute(k, v);
  set("data-accent", P.accento, "petrolio");
  set("data-font", P.font, "moderno");
  set("data-bg", P.sfondo, "tinta");
  set("data-radius", P.angoli, "arrotondati");
  set("data-density", P.densita, "comoda");
  r.style.setProperty("--fs", P.testo + "px");
}
let saveTimer;
function savePrefs(){
  applyPrefs.touched = true;
  applyPrefs();
  store("nb-prefs", JSON.stringify(P));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => api("savePrefs", P).catch(()=>{}), 600);
}
function catColor(cat){
  if (!cat) return "var(--c9)";
  if (P.catColors[cat] != null) return `var(--c${P.catColors[cat]})`;
  let h = 0; for (const ch of cat) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `var(--c${h % 9})`;
}
function noteColor(n){ return n.colore !== "" && n.colore != null ? `var(--c${n.colore})` : catColor(n.categoria); }

/* ---------- Disegno ---------- */
function hl(text){
  const t = esc(text); if(!S.q.trim()) return t;
  const words = S.q.trim().split(/\s+/).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(Boolean);
  return t.replace(new RegExp("("+words.join("|")+")","gi"),"<mark>$1</mark>");
}
function inScope(n){ return S.scope === "tutte" || n.sezione === S.scope; }
function matches(n){
  if(S.cat && n.categoria!==S.cat) return false;
  if(S.type && n.tipo!==S.type) return false;
  if(S.tag && !n.etichette.includes(S.tag)) return false;
  const q = S.q.trim().toLowerCase();
  if(!q) return true;
  if(S.hits[n.id]) return true;
  const hay = [n.titolo,n.riassunto,n.categoria,n.etichette.join(" "),n.percorso].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
function count(list,key){ const m={}; list.forEach(n=>{ (Array.isArray(n[key])?n[key]:[n[key]]).forEach(v=>{ if(v) m[v]=(m[v]||0)+1; })}); return m; }
const SORTS = {
  recenti:(a,b)=>String(b.data).localeCompare(String(a.data)),
  vecchie:(a,b)=>String(a.data).localeCompare(String(b.data)),
  titolo:(a,b)=>String(a.titolo).localeCompare(String(b.titolo),"it"),
  categoria:(a,b)=>String(a.categoria).localeCompare(String(b.categoria),"it") || String(b.data).localeCompare(String(a.data))
};

function render(){
  renderHero();
  const base = NOTES.filter(inScope);
  const res = base.filter(matches).sort(SORTS[P.ordine] || SORTS.recenti);
  $("#h2").textContent = {mie:"Le mie note", team:"Condivise", tutte:"Tutte le note"}[S.scope];
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on", b.dataset.s===S.scope));
  document.querySelectorAll("#views button").forEach(b=>b.classList.toggle("on", b.dataset.v===P.vista));
  $("#sort").value = P.ordine;
  $("#sub").innerHTML = `<b>${res.length}</b> di <b>${base.length}</b>` + (S.q?` per «${esc(S.q)}»`:"");
  const cc = count(base,"categoria"), tc = count(base,"tipo"), gc = count(base,"etichette");
  $("#cats").innerHTML = `<button class="${!S.cat?"on":""}" data-cat=""><span class="nm">Tutte</span><span class="n">${base.length}</span></button>` +
    Object.keys(cc).sort((a,b)=>a.localeCompare(b,"it")).map(c=>`<button class="${S.cat===c?"on":""}" data-cat="${esc(c)}"><span class="nm"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</span><span class="n">${cc[c]}</span></button>`).join("");
  $("#types").innerHTML = Object.keys(TYPES).filter(k=>tc[k]).map(k=>`<button class="${S.type===k?"on":""}" data-type="${k}"><span class="nm">${typeIcon(k)}${TYPES[k].l}</span><span class="n">${tc[k]}</span></button>`).join("");
  $("#tags").innerHTML = Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,24).map(([g])=>`<button class="chip ${S.tag===g?"on":""}" data-tag="${esc(g)}">${esc(g)}</button>`).join("");
  const grid = $("#grid");
  grid.className = "grid" + (P.vista==="lista"?" list":P.vista==="compatta"?" compact":"");
  // Con migliaia di note si disegnano solo le prime schede; le altre arrivano scorrendo.
  const shown = res.slice(0, S.shown);
  grid.innerHTML = res.length ? shown.map(card).join("") + (res.length > shown.length ?
    `<button class="more" id="more">Mostra altre ${Math.min(PAGE, res.length - shown.length)} di ${res.length - shown.length}</button>` : "") : emptyState(base.length);
  const pins = NOTES.filter(n=>n.preferita).sort(SORTS.recenti);
  $("#pinsec").hidden = !P.evidenza || !pins.length;
  $("#pins").innerHTML = pins.map(card).join("");
  watchThumbs(); watchMore();
}
/* Ridisegno raggruppato: più modifiche ravvicinate producono un solo disegno. */
let rafPending = false;
function renderSoon(){ if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; render(); }); }

/* ---------- Anteprime ---------- */
const thumbQueue = new Set(); let thumbBusy = 0;
const thumbObs = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { thumbObs.unobserve(e.target); thumbQueue.add(e.target.dataset.thumb); } });
  pumpThumbs();
}, {rootMargin:"400px"}) : null;
function watchThumbs(){
  document.querySelectorAll("[data-thumb]").forEach(el => {
    const id = el.dataset.thumb;
    if (id in THUMBS) return paintThumb(el, THUMBS[id]);
    if (thumbObs) thumbObs.observe(el); else thumbQueue.add(id);
  });
  if (!thumbObs) pumpThumbs();
}
function paintThumb(el, uri){
  if (!uri) { el.classList.add("nothumb"); return; }
  el.style.backgroundImage = `url("${uri}")`; el.classList.add("hasthumb");
}
async function pumpThumbs(){
  while (thumbQueue.size && thumbBusy < 3) {
    const ids = [...thumbQueue].slice(0, 8); ids.forEach(id => thumbQueue.delete(id));
    thumbBusy++;
    api("getThumbs", ids).then(map => {
      ids.forEach(id => { THUMBS[id] = map[id] || ""; document.querySelectorAll(`[data-thumb="${CSS.escape(id)}"]`).forEach(el => paintThumb(el, THUMBS[id])); });
    }).catch(() => ids.forEach(id => THUMBS[id] = "")).finally(() => { thumbBusy--; pumpThumbs(); });
  }
}
const moreObs = "IntersectionObserver" in window ? new IntersectionObserver(e => { if (e[0].isIntersecting) { S.shown += PAGE; render(); } }, {rootMargin:"600px"}) : null;
function watchMore(){ const m = $("#more"); if (m && moreObs) moreObs.observe(m); }
function greeting(){
  const h = new Date().getHours();
  return h < 6 ? "Buonanotte" : h < 13 ? "Buongiorno" : h < 18 ? "Buon pomeriggio" : "Buonasera";
}
function renderHero(){
  const hero = $("#hero");
  hero.hidden = !P.benvenuto && !P.statistiche;
  hero.style.gridTemplateColumns = P.benvenuto && P.statistiche ? "" : "minmax(0,1fr)";
  const weekAgo = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
  const week = NOTES.filter(n => n.data >= weekAgo).length;
  const rev = NOTES.filter(n => n.stato === "da rivedere").length;
  const plaud = NOTES.filter(n => n.tipo === "plaud").length;

/* Prossimi impegni (oggi e domani) nel riquadro di benvenuto */
function agendaHtml(){
  if (S.agenda === "err") return "";
  if (!S.agenda) return `<span class="ag-wait">Controllo il calendario…</span>`;
  const now = Date.now();
  const next = S.agenda.filter(e => e.giorno || new Date(e.fine).getTime() > now).slice(0, 3);
  if (!next.length) return `<button class="ag" data-act="cal">${icon("i-cal")}<span>Nessun impegno oggi e domani</span></button>`;
  return next.map(e => `<button class="ag" data-act="cal" data-day="${esc(evDay(e))}"><b>${esc(evWhen(e, true))}</b><span>${esc(e.titolo)}</span>${e.allegati.length?icon("i-clip","mini"):""}</button>`).join("");
}
async function loadAgenda(){
  const t = ymd(new Date());
  try { S.agenda = await api("listEvents", t, addDays(t, 2)); } catch(e){ S.agenda = "err"; }
  renderHero();
}

/* Scadenze e impegni trovati dall'AI nella nota, da mettere in calendario con un clic */
const ACTS = {};
function actsHtml(n){
  const a = ACTS[n.id];
  if (a === "wait") return `<p class="hint" style="margin:0">L'AI sta leggendo la nota…</p>`;
  if (!a) return `<p class="hint" style="margin:0 0 8px">L'AI legge la nota (anche la trascrizione completa) e propone scadenze, riunioni e compiti da mettere nel calendario.</p>
    <button class="btn" data-acts>${icon("i-flag")}Trova scadenze e impegni</button>`;
  if (!a.length) return `<p class="hint" style="margin:0">Nessuna scadenza o impegno con una data in questa nota.</p>`;
  return `<div class="acts">${a.map((x,i)=>`<div class="act ${x.fatto?"done":""}">
    <div class="actt"><span class="pill ${x.tipo==="scadenza"?"rev":x.tipo==="riunione"?"ai":"ok"}">${esc(x.tipo)}</span><b>${esc(x.titolo)}</b></div>
    ${x.dettagli?`<span class="hint">${esc(x.dettagli)}</span>`:""}
    ${x.fatto ? `<span class="hint">${icon("i-check","mini")}Nel calendario il ${esc(fmtD(x.data))}</span>` :
      `<div class="actrow"><input class="input" type="date" data-actd="${i}" value="${esc(x.data)}" aria-label="Giorno"><input class="input" type="time" data-acto="${i}" value="${esc(x.ora)}" aria-label="Ora (vuota = tutto il giorno)">
      <button class="btn" data-actadd="${i}">${icon("i-cal")}Aggiungi</button></div>`}
  </div>`).join("")}</div>`;
}
async function findActs(n){
  ACTS[n.id] = "wait"; $("#acts").innerHTML = `<div class="lbl5">${icon("i-flag")}Scadenze e impegni</div>` + actsHtml(n);
  try { ACTS[n.id] = await api("extractActions", n.id); } catch(e){ delete ACTS[n.id]; fail(e); }
  if (S.open === n.id) $("#acts").innerHTML = `<div class="lbl5">${icon("i-flag")}Scadenze e impegni</div>` + actsHtml(n);
}
async function addAct(n, i, btn){
  const x = ACTS[n.id][i];
  x.data = $(`[data-actd="${i}"]`).value; x.ora = $(`[data-acto="${i}"]`).value;
  if (!x.data) return toast("Scegli il giorno prima di aggiungere.");
  btn.disabled = true;
  try {
    const ev = await api("createEvent", { titolo:x.titolo, data:x.data, ora:x.ora, durata:60, descrizione:(x.dettagli||"") + "\n\nDalla nota: " + n.titolo, fileIds:[n.id] });
    x.fatto = true; markLinked([n.id], ev); S.agenda = null; loadAgenda(); render(); openNote(n.id); toast("Aggiunto al calendario con la nota allegata");
  } catch(e){ btn.disabled = false; fail(e); }
}

/* Anteprima nel pannello: immagine subito, lettore di Drive su richiesta (si carica solo se serve). */
function previewBox(n){
  const withAudio = (n.tipo==="plaud" || n.tipo==="vocale") && n.media;
  const playable = ["video","audio"].includes(n.tipo) || withAudio;
  if (!VISUAL.includes(n.tipo) && !playable) return "";
  const target = withAudio ? n.media : n.id;
  const label = withAudio ? "Ascolta la registrazione" : n.tipo==="audio" ? "Ascolta" : n.tipo==="video" ? "Guarda il video" : "Anteprima completa";
  const pic = VISUAL.includes(n.tipo) ? `<div class="pv-img" data-thumb="${esc(n.id)}"><span class="ph">${typeIcon(n.tipo)}</span></div>` : "";
  return `<div class="pv ${!pic?"pv-audio":""}" id="pv">${pic}
    <button class="btn ${pic?"pv-btn":""}" data-preview="${esc(target)}">${icon("i-play")}${label}</button></div>`;
}
function editable(n){ return n.mime ? (n.mime === "application/vnd.google-apps.document" || /^text\//.test(n.mime)) : ["txt","plaud"].includes(n.tipo); }
function replaceNote(updated){
  const i = NOTES.findIndex(x=>x.id===updated.id);
  if (i !== -1) NOTES[i] = Object.assign({}, NOTES[i], updated);
  cacheNotes(); render(); openNote(updated.id);
}
async function startEdit(n){
  const box = $("#textbox"); box.innerHTML = `<div class="lbl5">Modifica il testo</div><p style="margin:0;color:var(--muted)">Caricamento…</p>`;
  try {
    const text = await api("getEditableText", n.id);
    box.innerHTML = `<div class="lbl5">Modifica il testo</div>
      <textarea class="input" id="edtext" style="min-height:320px;font-size:14px">${esc(text)}</textarea>
      <p style="margin:6px 0 0;color:var(--muted);font-size:12.5px">${n.mime==="application/vnd.google-apps.document"?"Salvando, il documento Google diventa testo semplice: grassetti ed elenchi formattati si perdono. ":""}Dopo il salvataggio l'AI aggiorna riassunto ed etichette.</p>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" data-savetext>${icon("i-check")}Salva su Drive</button><button class="btn ghost" data-canceledit>Annulla</button></div>`;
    $("#edtext").focus();
  } catch(e){ fail(e); openNote(n.id); }
}
function swatch(v, on, label, attr){
  return `<button class="sw ${v===""?"none":""} ${on?"on":""}" style="--c:${v===""?"transparent":`var(--c${v})`}" ${attr}="${v}" aria-label="${esc(label)}" title="${esc(label)}"></button>`;
}
function closeLayer(){ if (REC.rec || REC.sr) stopRec(true); $("#layer").innerHTML=""; S.open=null; }
function save(n, changes){ cacheNotes(); return api("updateNote", n.id, changes).catch(fail); }
function toggleStar(id){

  n.preferita = !n.preferita; render(); if (S.open===id) openNote(id);
  save(n, {preferita:n.preferita}); toast(n.preferita?"Messa in evidenza":"Tolta dall'evidenza");
}

/* ---------- Nota vocale: registrazione e trascrizione nel browser ---------- */
const REC = { rec:null, chunks:[], blob:null, t0:0, timer:null, sr:null, final:"" };
function resetRec(){ stopRec(true); REC.blob=null; REC.final=""; $("#rectext").value=""; $("#recplay").hidden=true; $("#recsave").disabled=true; $("#recagain").hidden=true; $("#rectime").textContent="Premi per registrare una nota vocale"; }
async function startRec(){
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){
    $("#rechint").textContent = "Il browser non permette di usare il microfono qui: usa il registratore del telefono e scegli il file.";
    return $("#recfile").click();
  }
  REC.chunks = []; REC.final = $("#rectext").value ? $("#rectext").value + " " : "";
  const type = ["audio/webm;codecs=opus","audio/mp4","audio/ogg"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  REC.rec = new MediaRecorder(stream, type ? { mimeType:type } : undefined);
  REC.rec.ondataavailable = e => e.data.size && REC.chunks.push(e.data);
  REC.rec.onstop = () => { stream.getTracks().forEach(t=>t.stop()); if (REC.cancel) return;
    REC.blob = new Blob(REC.chunks, { type: REC.rec.mimeType || "audio/webm" });
    $("#recplay").src = URL.createObjectURL(REC.blob); $("#recplay").hidden = false; $("#recsave").disabled = false; $("#recagain").hidden = false; REC.rec = null; };
  REC.cancel = false; REC.rec.start(1000); REC.t0 = Date.now();
  $("#recbtn").classList.add("on"); $("#recbtn").setAttribute("aria-label","Ferma la registrazione");
  REC.timer = setInterval(() => { const s = Math.round((Date.now()-REC.t0)/1000); REC.secs = s;
    $("#rectime").textContent = `Registrazione ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} · premi per fermare`; if (s >= 3600) stopRec(); }, 500);
  // Trascrizione dal vivo, se il browser la offre (Chrome, Edge, Safari)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const sr = new SR(); REC.sr = sr; sr.lang = "it-IT"; sr.continuous = true; sr.interimResults = true;
    sr.onresult = e => { let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i];
      if (r.isFinal) REC.final += r[0].transcript.trim() + " "; else interim += r[0].transcript; }
      $("#rectext").value = REC.final + interim; };
    sr.onend = () => { if (REC.rec && REC.sr === sr) try { sr.start(); } catch(e){} };   // riprende dopo le pause
    try { sr.start(); $("#rechint").textContent = "Trascrizione automatica attiva."; } catch(e){}
  } else $("#rechint").textContent = "Questo browser non trascrive: puoi scrivere tu un riassunto nel riquadro.";
}
function stopRec(cancel){
  clearInterval(REC.timer);
  if (REC.sr) { const sr = REC.sr; REC.sr = null; try { sr.stop(); } catch(e){} }
  if (REC.rec) { REC.cancel = !!cancel; try { REC.rec.stop(); } catch(e){} if (cancel) REC.rec = null; }
  const b = $("#recbtn"); if (b) { b.classList.remove("on"); b.setAttribute("aria-label","Avvia la registrazione"); }
  if (!cancel && $("#rectime")) $("#rectime").textContent = "Registrazione pronta: ascoltala, correggi il testo e salva";
}
async function saveRec(){
  if (!REC.blob) return;
  if (REC.blob.size > BIG) return toast("Registrazione troppo lunga: massimo 20 MB.");
  const b = $("#recsave"); b.disabled = true; b.textContent = "Salvataggio e catalogazione…";
  try {
    const n = await api("saveVoiceNote", await readB64(REC.blob), REC.blob.type || "audio/webm", $("#rectext").value, scopeChoice(), REC.secs || 0);
    NOTES.unshift(n); S.scope = scopeChoice(); S.cat=S.type=S.tag=null; cacheNotes();
    closeLayer(); render(); toast("Nota vocale salvata e catalogata"); openNote(n.id);
  } catch(e){ b.disabled = false; b.textContent = "Salva nota vocale"; fail(e); }
}
function scopeChoice(){ return document.querySelector('input[name="v"]:checked').value; }
function readB64(file){
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => ko(new Error("Non riesco a leggere " + file.name)); r.readAsDataURL(file); });
}
/** Un file: caricato e catalogato subito. Più file: caricati uno alla volta, poi catalogati con la sincronizzazione. */
async function sendFiles(files){
  if (files.length === 1 && files[0].size <= BIG) return sendFile(files[0]);
  const scope = scopeChoice();
  const list = $("#uplist"); list.hidden = false; $("#drop").hidden = true; $("#upmode").hidden = true;
  list.innerHTML = files.map((f,i)=>`<li id="up${i}"><span class="nm">${esc(f.name)}</span><span class="st">In attesa</span></li>`).join("");
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const li = $("#up"+i), st = li.querySelector(".st");
    st.textContent = "Caricamento…"; li.className = "run";
    try {
      if (files[i].size > BIG) {
        const id = await uploadBig(files[i], scope, p => st.textContent = `Caricamento ${p}%`);
        if (files.length === 1) {   // un solo file grande: catalogato subito e aperto
          st.textContent = "Catalogazione…";
          const n = await api("finishUpload", id, scope, true);
          NOTES.unshift(n); S.scope = scope; S.cat = S.type = S.tag = null; cacheNotes();
          closeLayer(); render(); toast("File caricato e catalogato"); return openNote(n.id);
        }
      } else {
        await api("uploadRaw", files[i].name, files[i].type, await readB64(files[i]), scope);
      }
      st.textContent = "Caricato"; li.className = "done"; ok++;
    }
    catch(e){ st.textContent = String(e.message || e); li.className = "err"; }
  }
  $("#upmsg").hidden = false;
  $("#upmsg").textContent = `${ok} file su ${files.length} caricati. Ora l'AI li cataloga: può richiedere qualche minuto.`;
  S.scope = scope; S.cat = S.type = S.tag = null;
  await catalogAll();
}
async function catalogAll(){
  for (let round = 0; round < 12; round++) {
    let r; try { r = await api("syncNow"); } catch(e){ fail(e); break; }
    if (r.restanti < 0) { await new Promise(res=>setTimeout(res, 15000)); continue; }
    const msg = $("#upmsg"); if (msg) msg.textContent = r.restanti ? `Catalogate ${r.fatti} note, ne restano ${r.restanti}…` : "Catalogazione completata.";
    if (!r.restanti) break;
  }
  await load(); toast("Caricamento massivo completato");
}
function sendFile(file){
  const r = new FileReader();
  r.onload = () => sendData(file.name, file.type, String(r.result).split(",")[1]);
  r.readAsDataURL(file);
}
async function sendData(name, type, b64){
  const scope = scopeChoice();
  $("#upmsg").hidden = false;
  try {
    const n = await api("uploadNote", name, type, b64, scope);
    NOTES.unshift(n); S.scope = scope; S.cat=S.type=S.tag=null; cacheNotes();
    closeLayer(); render(); toast("Nota salvata e catalogata"); openNote(n.id);
  } catch(e){ $("#upmsg").hidden = true; fail(e); }
}

function fmtAnswer(t, fonti){

async function ask(question){
  question = question.trim(); if (!question) return;
  const history = S.chat.filter(m=>!m.attesa).map(m=>({ruolo:m.ruolo, testo:m.testo}));
  S.chat.push({ruolo:"utente", testo:question}, {ruolo:"ai", attesa:true});
  const log = $("#chatlog"); if (log) { log.innerHTML = chatLog(); log.scrollTop = log.scrollHeight; }
  try {
    const r = await api("askArchive", question, history, {ovunque: !!S.ovunque});

  } catch(e){
    S.chat[S.chat.length-1] = {ruolo:"ai", testo:"Non sono riuscito a rispondere: " + (e.message || e), fonti:[]};
  }
  const log2 = $("#chatlog"); if (log2) { log2.innerHTML = chatLog(); log2.scrollTop = log2.scrollHeight; }

/* ---------- Calendario ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (day, n) => { const d = new Date(day+"T12:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const evDay = e => e.giorno ? e.inizio.slice(0,10) : ymd(new Date(e.inizio));
function evWhen(e, short){
  if (e.giorno) return short ? (evDay(e) <= ymd(new Date()) ? "Oggi" : "Domani") : "Tutto il giorno";
  const t = new Date(e.inizio).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  if (!short) return t + "–" + new Date(e.fine).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  return (evDay(e)===ymd(new Date()) ? "" : "Domani ") + t;
}
const CAL = { month:null, day:null, events:{}, attach:null, form:false };
function openCal(attachIds, day){
  S.open = null;
  const today = ymd(new Date());
  CAL.day = day || CAL.day || today;
  CAL.month = CAL.day.slice(0,7);
  CAL.attach = attachIds && attachIds.length ? attachIds : null;
  CAL.form = false;
  drawCal(); loadMonth(CAL.month);
}
function monthRange(m){
  const first = new Date(m+"-01T12:00:00");
  const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));   // lunedì della prima settimana
  const days = []; for (let i = 0; i < 42; i++){ const d = new Date(start); d.setDate(start.getDate()+i); days.push(ymd(d)); }
  return days;
}
async function loadMonth(m){
  if (CAL.events[m]) return;
  CAL.events[m] = "loading"; drawCal();
  const days = monthRange(m);
  try { CAL.events[m] = await api("listEvents", days[0], addDays(days[41], 1)); }
  catch(e){ CAL.events[m] = null; fail(e); }
  if (CAL.month === m) drawCal();
}
function eventsOn(day){
  const list = CAL.events[CAL.month];
  if (!Array.isArray(list)) return [];
  return list.filter(e => e.giorno ? (day >= e.inizio.slice(0,10) && day < e.fine.slice(0,10)) : evDay(e) === day);
}
function drawCal(){

  const dayEvents = eventsOn(CAL.day);
  const dayNotes = NOTES.filter(n=>n.data===CAL.day);
  const att = CAL.attach ? CAL.attach.map(id=>NOTES.find(x=>x.id===id)).filter(Boolean) : null;
  const scroll = $(".drawer.cal .db") ? $(".drawer.cal .db").scrollTop : 0;

      <button class="btn icon ghost" data-close aria-label="Chiudi">${icon("i-close")}</button></div>
    ${att ? `<div class="attachbar">${icon("i-clip")}<span>Allega <b>${att.length===1?esc(att[0].titolo):att.length+" file"}</b>: scegli un giorno, poi un evento o «Allega al giorno».</span><button class="btn ghost" data-calnoattach>Annulla</button></div>` : ""}
    <div class="db">
      <div class="calhead"><button class="btn icon ghost" data-calnav="-1" aria-label="Mese precedente">${icon("i-chevl")}</button>
        <b>${esc(label)}</b>${loading?`<span class="hint">caricamento…</span>`:""}
        <button class="btn icon ghost" data-calnav="1" aria-label="Mese successivo">${icon("i-chevr")}</button>
        <button class="btn" data-caltoday>Oggi</button></div>
      <div class="month">${["lun","mar","mer","gio","ven","sab","dom"].map(d=>`<span class="wd">${d}</span>`).join("")}
        ${days.map(d => { const ev = eventsOn(d).length; return `<button class="day ${d.slice(0,7)!==m?"out":""} ${d===today?"today":""} ${d===CAL.day?"sel":""}" data-calday="${d}">
          <span>${Number(d.slice(8))}</span><span class="dots">${ev?`<i class="e"></i>`.repeat(Math.min(ev,3)):""}${noteDays[d]?`<i class="n"></i>`:""}</span></button>`; }).join("")}</div>

/* ---------- Caricamento diretto su Drive (file grandi, video) ---------- */
async function uploadBig(file, scope, onProgress){
  if (window.NB_DEMO) { for (let p = 0; p <= 100; p += 25) { onProgress(p); await new Promise(r=>setTimeout(r,150)); } return api("demoUpload", file.name, file.type, scope); }
  const t = await api("getUploadTarget", scope);
  const start = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id", {
    method:"POST",
    headers:{ "Authorization":"Bearer " + t.token, "Content-Type":"application/json; charset=UTF-8",
      "X-Upload-Content-Type": file.type || "application/octet-stream", "X-Upload-Content-Length": String(file.size) },
    body: JSON.stringify({ name:file.name, parents:[t.folderId], mimeType:file.type || undefined })
  });
  const url = start.headers.get("Location");
  if (!start.ok || !url) throw new Error("Drive non ha accettato il caricamento (" + start.status + ").");
  const CHUNK = 32 * 256 * 1024; // 8 MB, multiplo di 256 KB come richiede Drive
  for (let pos = 0; pos < file.size; ) {
    const end = Math.min(pos + CHUNK, file.size);
    const r = await fetch(url, { method:"PUT", headers:{ "Content-Range":`bytes ${pos}-${end-1}/${file.size}` }, body:file.slice(pos, end) });
    if (r.status === 308) { const rg = r.headers.get("Range"); pos = rg ? Number(rg.split("-")[1]) + 1 : end; onProgress(Math.round(pos/file.size*100)); continue; }
    if (!r.ok) throw new Error("Caricamento interrotto (" + r.status + "). Riprova.");
    onProgress(100);
    return (await r.json()).id;
  }
  throw new Error("Caricamento non completato.");
}

/* ---------- Selezione multipla ---------- */
function setSelecting(on){
  S.sel = on ? new Set() : null;
  $("#selbar").hidden = !on; $("#selbtn").classList.toggle("on", on);
  updateSelbar(); render();
}
function updateSelbar(){ if (S.sel) $("#selcount").textContent = S.sel.size + (S.sel.size===1?" selezionata":" selezionate"); }
async function bulk(action){
  const ids = [...S.sel]; if (!ids.length) return toast("Seleziona prima qualche nota.");
  if (action === "mail") { if (ids.length > 20) return toast("Puoi inviare al massimo 20 file per email."); return openMail(ids); }
  if (action === "cal") { if (ids.length > 25) return toast("Un evento accetta al massimo 25 allegati."); return openCal(ids); }
  if (action === "del" && !$("#selbar").dataset.confirm) {
    $("#selbar").dataset.confirm = "1";
    $("#selcount").textContent = `Eliminare ${ids.length} note? Vanno nel cestino di Drive (recuperabili per 30 giorni). Premi di nuovo Elimina per confermare.`;
    return;
  }
  delete $("#selbar").dataset.confirm;
  let ok = 0, ko = 0;
  for (const id of ids) {
    const n = NOTES.find(x=>x.id===id); if (!n) continue;
    $("#selcount").textContent = `Elaborazione ${ok+ko+1} di ${ids.length}…`;
    try {
      if (action === "del") { await api("deleteNote", id); NOTES = NOTES.filter(x=>x.id!==id); }
      else if (n.sezione !== action) { await api("moveNote", id, action); n.sezione = action; }
      ok++;
    } catch(e){ ko++; }
  }
  cacheNotes();
  toast(`${ok} note ${action==="del"?"eliminate":"spostate"}` + (ko?`, ${ko} non riuscite (file di altre persone o errori)`:""));
  setSelecting(false);
}

  if(e.target.closest("[data-edit]")) return startEdit(n);
  if(e.target.closest("[data-canceledit]")) return openNote(n.id);
  if(e.target.closest("[data-savetext]")){ const b=e.target.closest("[data-savetext]"); b.disabled=true; b.textContent="Salvataggio e catalogazione…";
    try { replaceNote(await api("saveNoteText", n.id, $("#edtext").value)); toast("Salvato su Drive"); } catch(err){ b.disabled=false; b.textContent="Salva su Drive"; fail(err); }
    return; }
  if(e.target.closest("[data-replace]")){ $("#repfile").click(); return; }
  const nc=e.target.closest("[data-ncol]");
  if(nc){ n.colore = nc.dataset.ncol===""?"":Number(nc.dataset.ncol); render(); openNote(n.id); save(n,{colore:n.colore}); return; }
  const rm=e.target.closest("[data-rmtag]");
  if(rm){ n.etichette=n.etichette.filter(g=>g!==rm.dataset.rmtag); render(); openNote(n.id); save(n,{etichette:n.etichette}); }
  if(e.target.closest("[data-ok]")){ n.stato="confermata"; render(); openNote(n.id); save(n,{conferma:true, etichette:n.etichette, categoria:n.categoria}); toast("Catalogazione confermata"); }
  if(e.target.closest("[data-text]")){ $("#full").textContent="Caricamento…"; try { $("#full").textContent = (await api("getNoteText", n.id)) || "Nessun testo estratto."; } catch(err){ fail(err); } }
  if(e.target.closest("[data-move]")){
    const to = n.sezione==="team"?"mie":"team";
    try { await api("moveNote", n.id, to); n.sezione=to; cacheNotes(); render(); openNote(n.id); toast(to==="team"?"Ora la vede tutto il team":"Ora la vedi solo tu"); } catch(err){ fail(err); }
  }
});
$("#layer").addEventListener("submit",e=>{
  if(e.target.id==="chatform"){ e.preventDefault(); const q=$("#chatq"); const v=q.value; q.value=""; ask(v); }
  if(e.target.id==="mailform"){ e.preventDefault(); sendMail(); }
  if(e.target.id==="evform"){ e.preventDefault(); saveEvent(); }
});
$("#layer").addEventListener("change",async e=>{
  if (e.target.id==="ovunque") { S.ovunque = e.target.checked; return; }
  if (e.target.id==="repfile" && e.target.files[0]) { const f=e.target.files[0]; const n=NOTES.find(x=>x.id===S.open); if(!n) return;
    if (f.size > 20*1024*1024) return toast("Il file supera 20 MB.");
    toast("Sostituzione e catalogazione in corso…");
    try { replaceNote(await api("replaceFile", n.id, f.name, f.type, await readB64(f))); toast("File sostituito su Drive"); } catch(err){ fail(err); }
    return; }
  if (e.target.matches("[data-tog]")) { P[e.target.dataset.tog] = e.target.checked; savePrefs(); render(); return; }
  if (e.target.id==="pnome") { P.nome = e.target.value.trim(); savePrefs(); $("#av").textContent=(P.nome||ME).slice(0,2).toUpperCase(); render(); toast("Nome salvato"); return; }
  const n=NOTES.find(x=>x.id===S.open); if(!n) return;
  if (e.target.id==="ttl") { const v=e.target.value.trim(); if(v && v!==n.titolo){ n.titolo=v; render(); save(n,{titolo:v}); toast("Titolo aggiornato"); } }
  if (e.target.id==="cat") { const v=e.target.value.trim(); if(v && v!==n.categoria){ n.categoria=v; render(); openNote(n.id); save(n,{categoria:v}); toast("Categoria aggiornata"); } }
});
$("#layer").addEventListener("keydown",e=>{
  if(e.target.id==="chatq" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("#chatform").requestSubmit(); return; }
  const n=NOTES.find(x=>x.id===S.open);
  if(e.key==="Enter" && (e.target.id==="ttl"||e.target.id==="cat"||e.target.id==="pnome")) { e.target.blur(); return; }
  if(n && e.target.id==="addtag" && e.key==="Enter"){ const v=e.target.value.trim().toLowerCase();
    if(v && !n.etichette.includes(v)){ n.etichette.push(v); render(); openNote(n.id); save(n,{etichette:n.etichette}); setTimeout(()=>$("#addtag")?.focus(),0);} }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(S.sel && !S.open && !$("#layer").innerHTML) setSelecting(false); closeLayer(); } if(e.key==="/" && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); } });

try { const saved = JSON.parse(store("nb-prefs") || "null"); if (saved) P = Object.assign({}, DEFAULTS, saved); } catch(e){}
S.scope = P.sezione;
applyPrefs();
const cached = cachedNotes();
if (cached && !window.NB_DEMO) { ME = cached.me; NOTES = cached.notes; document.body.classList.add("stale"); render(); }
load();
</script>
</body>
</html>
