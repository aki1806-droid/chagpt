<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<base target="_top">
<title>Notabene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<?!= HtmlService.createHtmlOutputFromFile('Styles').getContent(); ?>
</head>
<body>
<header class="top">
  <div class="brand">Notabene <span class="nb">NB</span></div>
  <label class="search" for="q">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Cerca in titoli, testo, trascrizioni, etichette…" autocomplete="off">
  </label>
  <div class="actions">
    <button class="btn mfilters" id="mf" aria-expanded="false">Filtri</button>
    <button class="btn" id="sync" title="Cerca file nuovi nelle cartelle Drive">Aggiorna</button>
    <button class="btn primary" id="up"><span aria-hidden="true">+</span> <span class="lbl-up">Carica nota</span></button>
    <button class="avatar" id="av" aria-haspopup="true" aria-label="Account"></button>
  </div>
</header>
<div class="menu" id="menu" hidden></div>

<div class="wrap">
  <aside id="side">
    <div><h3>Categorie</h3><div class="flist" id="cats"></div></div>
    <div><h3>Tipo di file</h3><div class="flist" id="types"></div></div>
    <div><h3>Etichette</h3><div class="chips" id="tags"></div></div>
  </aside>
  <main>
    <div id="banner"></div>
    <div class="head">
      <h1 id="h1">Le mie note</h1>
      <div class="seg" id="seg">
        <button data-s="mie" class="on">Personali</button>
        <button data-s="team">Condivise</button>
        <button data-s="tutte">Tutte</button>
      </div>
    </div>
    <p class="sub" id="sub"></p>
    <div class="grid" id="grid"><div class="loading">Caricamento delle note…</div></div>
  </main>
</div>
<div id="layer"></div>

<script>
const TYPES = {
  plaud:{l:"Plaud", c:"--audio"}, audio:{l:"Audio", c:"--audio"}, doc:{l:"Documento", c:"--doc"},
  pdf:{l:"PDF", c:"--pdf"}, img:{l:"Foto/scansione", c:"--img"}, txt:{l:"Testo", c:"--txt"}, altro:{l:"Altro", c:"--txt"}
};
let NOTES = [], ME = "", BOOT = {};
let S = {scope:"mie", cat:null, type:null, tag:null, q:"", open:null, hits:{}};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD = d => d ? new Date(d+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}) : "";
const pref = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };

function api(fn, ...args) {
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function fail(e){ toast(String(e && e.message || e)); }

function hl(text){
  const t = esc(text); if(!S.q.trim()) return t;
  const words = S.q.trim().split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(Boolean);
  return t.replace(new RegExp("("+words.map(esc).join("|")+")","gi"),"<mark>$1</mark>");
}
function inScope(n){ return S.scope === "tutte" || n.sezione === S.scope; }
function matches(n){
  if(S.cat && n.categoria!==S.cat) return false;
  if(S.type && n.tipo!==S.type) return false;
  if(S.tag && !n.etichette.includes(S.tag)) return false;
  const q = S.q.trim().toLowerCase();
  if(!q) return true;
  if(S.hits[n.id]) return true;
  const hay = [n.titolo,n.riassunto,n.categoria,n.etichette.join(" "),n.percorso].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
function count(list,key){ const m={}; list.forEach(n=>{ (Array.isArray(n[key])?n[key]:[n[key]]).forEach(v=>{ if(v) m[v]=(m[v]||0)+1; })}); return m; }

function render(){
  const base = NOTES.filter(inScope);
  const res = base.filter(matches).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  $("#h1").textContent = {mie:"Le mie note", team:"Condivise con il team", tutte:"Tutte le note"}[S.scope];
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on", b.dataset.s===S.scope));
  const toRev = base.filter(n=>n.stato==="da rivedere").length;
  $("#sub").innerHTML = `<b>${res.length}</b> di <b>${base.length}</b> note` + (S.q?` per «${esc(S.q)}»`:"") + (toRev?` · <b>${toRev}</b> da rivedere`:"");
  const cc = count(base,"categoria"), tc = count(base,"tipo"), gc = count(base,"etichette");
  $("#cats").innerHTML = `<button class="${!S.cat?"on":""}" data-cat="">Tutte le categorie <span class="n">${base.length}</span></button>` +
    Object.keys(cc).sort().map(c=>`<button class="${S.cat===c?"on":""}" data-cat="${esc(c)}">${esc(c)} <span class="n">${cc[c]}</span></button>`).join("");
  $("#types").innerHTML = Object.keys(TYPES).filter(k=>tc[k]).map(k=>`<button class="${S.type===k?"on":""}" data-type="${k}"><span><span class="dot" style="background:var(${TYPES[k].c})"></span>${TYPES[k].l}</span><span class="n">${tc[k]}</span></button>`).join("");
  $("#tags").innerHTML = Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([g])=>`<button class="chip ${S.tag===g?"on":""}" data-tag="${esc(g)}">${esc(g)}</button>`).join("");
  $("#grid").innerHTML = res.length ? res.map(card).join("") : emptyState(base.length);
}
function emptyState(total){
  if (total) return `<div class="empty">Nessuna nota trovata. Prova a togliere un filtro o a cercare un'altra parola.</div>`;
  return `<div class="empty">Questa sezione è vuota. Carica una nota con «+ Carica nota» oppure mettila nella cartella Drive
    «${S.scope==="team"?"Notabene Condivise":"Notabene Personale"}» e premi «Aggiorna».</div>`;
}
function card(n){
  const T = TYPES[n.tipo] || TYPES.altro;
  const hit = S.hits[n.id] ? `<div class="snippet">${hl(S.hits[n.id])}</div>` : "";
  return `<button class="card" data-open="${esc(n.id)}">
    <div class="meta"><span class="type"><i style="background:var(${T.c})"></i>${T.l}</span><span>${fmtD(n.data)}</span></div>
    <h4>${hl(n.titolo)}</h4>
    <p>${hl(n.riassunto)}</p>${hit}
    <div class="tags">${n.etichette.map(g=>`<span class="tag">${hl(g)}</span>`).join("")}</div>
    <div class="foot"><span class="vis">${n.sezione==="team"?"Condivisa":"Personale"} · ${esc(n.categoria)}</span>
    ${n.stato==="da rivedere"?'<span class="pill rev">Da rivedere</span>':n.stato==="confermata"?'<span class="pill ai">Confermata</span>':'<span class="pill ai">AI</span>'}</div>
  </button>`;
}

function openNote(id){
  const n = NOTES.find(x=>x.id===id); if(!n) return; S.open=id;
  const T = TYPES[n.tipo] || TYPES.altro;
  $("#layer").innerHTML = `<div class="scrim" data-close></div>
  <section class="drawer" role="dialog" aria-label="${esc(n.titolo)}">
    <div class="dh"><span class="type" style="font-family:var(--mono);font-size:12px"><i style="background:var(${T.c})"></i>${T.l}</span>
      <button class="btn ghost" data-close aria-label="Chiudi">✕</button></div>
    <div class="db">
      <h2>${esc(n.titolo)}</h2>
      <div class="box"><h5>Riassunto ${n.stato==="da rivedere"?'<span class="pill rev" style="margin-left:6px">Da rivedere</span>':""}</h5><div>${hl(n.riassunto)}</div></div>
      <div><h5 style="margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Etichette</h5>
        <div class="tags tagedit">${n.etichette.map(g=>`<span class="tag">${esc(g)}<button data-rmtag="${esc(g)}" aria-label="Rimuovi ${esc(g)}">×</button></span>`).join("")}
        <input class="addtag" id="addtag" placeholder="+ etichetta"></div></div>
      <div><label for="cat" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Categoria</label>
        <input id="cat" class="btn" style="width:100%;text-align:left" value="${esc(n.categoria)}"></div>
      <dl class="box kv"><dt>Data</dt><dd>${fmtD(n.data)}</dd><dt>Proprietario</dt><dd>${esc(n.autore)}</dd>
        <dt>Sezione</dt><dd>${n.sezione==="team"?"Condivisa con il team":"Personale, solo tu"}</dd><dt>Percorso</dt><dd>${esc(n.percorso)}</dd></dl>
      <div class="box"><h5>Testo estratto</h5><div class="full" id="full"><button class="btn" data-text>Mostra il testo</button></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-move>${n.sezione==="team"?"Rendi personale":"Condividi con il team"}</button>
        ${n.stato!=="confermata"?`<button class="btn" data-ok>Conferma etichette</button>`:""}
        <a class="btn primary" href="${esc(n.url)}" target="_blank" rel="noopener" style="text-decoration:none">Apri in Drive</a>
      </div>
    </div></section>`;
}
function closeLayer(){ $("#layer").innerHTML=""; S.open=null; }

async function save(n, changes){
  try { await api("updateNote", n.id, changes); } catch(e){ fail(e); }
}

function upload(){
  $("#layer").innerHTML = `<div class="scrim" data-close></div><div class="modal"><div class="panel" role="dialog" aria-label="Carica nota">
    <h2>Carica una nota</h2>
    <div class="drop" id="drop"><input type="file" id="file" hidden>
      <div>Trascina qui un file oppure <button class="btn" id="pick">scegli dal dispositivo</button></div>
      <div style="font-size:13px;margin-top:6px">Testo, documenti, PDF, foto, audio. Massimo 20 MB.</div></div>
    <div class="radio">
      <label><input type="radio" name="v" value="mie" ${S.scope!=="team"?"checked":""}> <span>Personale<small>La vedi solo tu</small></span></label>
      <label><input type="radio" name="v" value="team" ${S.scope==="team"?"checked":""}> <span>Condivisa<small>La vede tutto il team</small></span></label>
    </div>
    <p id="upmsg" style="margin:0;color:var(--muted)" hidden>Salvataggio su Drive, lettura del testo e catalogazione in corso…</p>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" data-close>Annulla</button></div>
  </div></div>`;
  const f=$("#file"), d=$("#drop");
  $("#pick").onclick=()=>f.click();
  f.onchange=()=>f.files[0]&&send(f.files[0]);
  d.ondragover=e=>{e.preventDefault();d.classList.add("over")};
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over");e.dataTransfer.files[0]&&send(e.dataTransfer.files[0])};
}
function send(file){
  if (file.size > 20*1024*1024) return toast("Il file supera 20 MB. Caricalo direttamente nella cartella Drive.");
  const scope = document.querySelector('input[name="v"]:checked').value;
  $("#upmsg").hidden = false;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const b64 = String(r.result).split(",")[1];
      const n = await api("uploadNote", file.name, file.type, b64, scope);
      NOTES.unshift(n); S.scope = scope; S.cat=S.type=S.tag=null;
      closeLayer(); render(); toast("Nota salvata e catalogata"); openNote(n.id);
    } catch(e){ $("#upmsg").hidden = true; fail(e); }
  };
  r.readAsDataURL(file);
}

async function load(){
  try {
    BOOT = await api("getBootstrap");
    ME = BOOT.email;
    NOTES = [...BOOT.personal, ...BOOT.team];
    $("#av").textContent = ME.slice(0,2).toUpperCase();
    banner();
    render();
  } catch(e){ $("#grid").innerHTML = `<div class="empty">Non riesco a leggere le cartelle: ${esc(e.message||e)}</div>`; }
}
function banner(){
  const msgs = [];
  if (!BOOT.aiEnabled) msgs.push("La catalogazione AI non è ancora attiva: mancano le impostazioni AI_PROVIDER e chiave.");
  if (!BOOT.syncInstalled) msgs.push(`I file nuovi su Drive vengono letti quando premi «Aggiorna». <button class="btn" id="auto">Attiva aggiornamento ogni ora</button>`);
  $("#banner").innerHTML = msgs.map(m=>`<div class="banner"><span>${m}</span></div>`).join("");
  const a = $("#auto"); if (a) a.onclick = async () => { try { await api("installSync"); BOOT.syncInstalled = true; banner(); toast("Aggiornamento automatico attivo"); } catch(e){ fail(e); } };
}

let searchTimer;
$("#q").addEventListener("input",e=>{
  S.q=e.target.value; S.hits={}; render();
  clearTimeout(searchTimer);
  if (S.q.trim().length < 3) return;
  const q = S.q;
  searchTimer = setTimeout(async () => {
    try { const r = await api("searchText", q); if (q !== S.q) return; r.forEach(h => S.hits[h.id] = h.estratto); render(); } catch(e){}
  }, 450);
});
$("#seg").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; S.scope=b.dataset.s; pref("nb-scope", S.scope); S.cat=S.type=S.tag=null; render();});
$("#side").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if("cat" in b.dataset) S.cat=b.dataset.cat||null;
  if(b.dataset.type) S.type = S.type===b.dataset.type?null:b.dataset.type;
  if(b.dataset.tag) S.tag = S.tag===b.dataset.tag?null:b.dataset.tag;
  render();
});
$("#grid").addEventListener("click",e=>{const c=e.target.closest("[data-open]"); if(c) openNote(c.dataset.open);});
$("#up").onclick=upload;
$("#sync").onclick=async()=>{
  const b=$("#sync"); b.disabled=true; b.textContent="Aggiornamento…";
  try { const r = await api("syncNow"); toast(r.restanti<0 ? r.messaggio : `${r.fatti} note catalogate` + (r.restanti?`, ${r.restanti} in attesa: premi di nuovo`:"")); await load(); }
  catch(e){ fail(e); } finally { b.disabled=false; b.textContent="Aggiorna"; }
};
$("#mf").onclick=()=>{const o=$("#side").classList.toggle("open"); $("#mf").setAttribute("aria-expanded",o);};
$("#av").onclick=()=>{
  const m=$("#menu"); m.hidden=!m.hidden;
  m.innerHTML=`<div class="lbl">Connesso come</div><div style="padding:2px 10px 8px;font-weight:600;overflow-wrap:anywhere">${esc(ME)}</div>
  <div class="lbl">Per cambiare account usa il menu di Google</div>`;
};
document.addEventListener("click",e=>{ if(!e.target.closest("#menu,#av")) $("#menu").hidden=true; });
$("#layer").addEventListener("click",async e=>{
  if(e.target.closest("[data-close]")) return closeLayer();
  const n=NOTES.find(x=>x.id===S.open); if(!n) return;
  const rm=e.target.closest("[data-rmtag]");
  if(rm){ n.etichette=n.etichette.filter(g=>g!==rm.dataset.rmtag); render(); openNote(n.id); save(n,{etichette:n.etichette}); }
  if(e.target.closest("[data-ok]")){ n.stato="confermata"; render(); openNote(n.id); save(n,{conferma:true, etichette:n.etichette, categoria:n.categoria}); toast("Etichette confermate"); }
  if(e.target.closest("[data-text]")){ $("#full").textContent="Caricamento…"; try { $("#full").textContent = (await api("getNoteText", n.id)) || "Nessun testo estratto."; } catch(err){ fail(err); } }
  if(e.target.closest("[data-move]")){
    const to = n.sezione==="team"?"mie":"team";
    try { await api("moveNote", n.id, to); n.sezione=to; render(); openNote(n.id); toast(to==="team"?"Ora la vede tutto il team":"Ora la vedi solo tu"); } catch(err){ fail(err); }
  }
});
$("#layer").addEventListener("keydown",e=>{
  const n=NOTES.find(x=>x.id===S.open); if(!n) return;
  if(e.target.id==="addtag" && e.key==="Enter"){ const v=e.target.value.trim().toLowerCase();
    if(v && !n.etichette.includes(v)){ n.etichette.push(v); render(); openNote(n.id); save(n,{etichette:n.etichette}); setTimeout(()=>$("#addtag")?.focus(),0);} }
  if(e.target.id==="cat" && e.key==="Enter"){ const v=e.target.value.trim(); if(v){ n.categoria=v; render(); openNote(n.id); save(n,{categoria:v}); toast("Categoria aggiornata"); } }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLayer(); if(e.key==="/" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); } });
S.scope = pref("nb-scope") || "mie";
load();
</script>
</body>
</html>
