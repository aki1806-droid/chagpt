    <aside id="side">

            <button data-s="mie"><svg class="i"><use href="#i-lock"/></svg>Personali</button>

<script>
/* ---------- Dati e impostazioni ---------- */
const TYPES = {
  plaud:{l:"Plaud", c:"--c4"}, audio:{l:"Audio", c:"--c4"}, doc:{l:"Documento", c:"--c0"},
  pdf:{l:"PDF", c:"--c1"}, img:{l:"Foto", c:"--c2"}, txt:{l:"Testo", c:"--c9"}, altro:{l:"Altro", c:"--c9"}
};
const ACCENTS = [["petrolio","#1d5c6b"],["corallo","#c2513a"],["indaco","#3d55c4"],["bosco","#2f7d4f"],["prugna","#8a3d7e"],["ambra","#9a6200"],["grafite","#34424c"]];
const DEFAULTS = {
  nome:"", tema:"auto", accento:"petrolio", font:"moderno", sfondo:"tinta", angoli:"arrotondati", densita:"comoda", testo:15,
  benvenuto:true, statistiche:true, evidenza:true, schedeColorate:false, sezione:"mie", vista:"griglia", ordine:"recenti", catColors:{}
};
let P = Object.assign({}, DEFAULTS);
let NOTES = [], ME = "", BOOT = {};
let S = {scope:"mie", cat:null, type:null, tag:null, q:"", open:null, hits:{}, sel:null, chat:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD = d => d ? new Date(d+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}) : "";
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const icon = (id, cls) => `<svg class="i ${cls||""}"><use href="#${id}"/></svg>`;

function api(fn, ...args) {
  if (window.NB_DEMO) return Promise.resolve().then(() => window.NB_DEMO[fn](...args));
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function fail(e){ toast(String(e && e.message || e)); }

/* ---------- Aspetto ---------- */
function applyPrefs(){
  const r = document.documentElement;
  if (P.tema === "auto") { if (applyPrefs.touched) r.removeAttribute("data-theme"); }
  else r.setAttribute("data-theme", P.tema);
  const set = (k, v, def) => v === def ? r.removeAttribute(k) : r.setAttribute(k, v);
  set("data-accent", P.accento, "petrolio");
  set("data-font", P.font, "moderno");
  set("data-bg", P.sfondo, "tinta");
  set("data-radius", P.angoli, "arrotondati");
  set("data-density", P.densita, "comoda");
  r.style.setProperty("--fs", P.testo + "px");
}
let saveTimer;
function savePrefs(){
  applyPrefs.touched = true;
  applyPrefs();
  store("nb-prefs", JSON.stringify(P));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => api("savePrefs", P).catch(()=>{}), 600);
}
function catColor(cat){
  if (!cat) return "var(--c9)";
  if (P.catColors[cat] != null) return `var(--c${P.catColors[cat]})`;
  let h = 0; for (const ch of cat) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `var(--c${h % 9})`;
}
function noteColor(n){ return n.colore !== "" && n.colore != null ? `var(--c${n.colore})` : catColor(n.categoria); }

/* ---------- Disegno ---------- */
function hl(text){
  const t = esc(text); if(!S.q.trim()) return t;
  const words = S.q.trim().split(/\s+/).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(Boolean);
  return t.replace(new RegExp("("+words.join("|")+")","gi"),"<mark>$1</mark>");
}
function inScope(n){ return S.scope === "tutte" || n.sezione === S.scope; }
function matches(n){
  if(S.cat && n.categoria!==S.cat) return false;
  if(S.type && n.tipo!==S.type) return false;
  if(S.tag && !n.etichette.includes(S.tag)) return false;
  const q = S.q.trim().toLowerCase();
  if(!q) return true;
  if(S.hits[n.id]) return true;
  const hay = [n.titolo,n.riassunto,n.categoria,n.etichette.join(" "),n.percorso].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
function count(list,key){ const m={}; list.forEach(n=>{ (Array.isArray(n[key])?n[key]:[n[key]]).forEach(v=>{ if(v) m[v]=(m[v]||0)+1; })}); return m; }
const SORTS = {
  recenti:(a,b)=>String(b.data).localeCompare(String(a.data)),
  vecchie:(a,b)=>String(a.data).localeCompare(String(b.data)),
  titolo:(a,b)=>String(a.titolo).localeCompare(String(b.titolo),"it"),
  categoria:(a,b)=>String(a.categoria).localeCompare(String(b.categoria),"it") || String(b.data).localeCompare(String(a.data))
};

function render(){
  renderHero();
  const base = NOTES.filter(inScope);
  const res = base.filter(matches).sort(SORTS[P.ordine] || SORTS.recenti);
  $("#h2").textContent = {mie:"Le mie note", team:"Condivise", tutte:"Tutte le note"}[S.scope];
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on", b.dataset.s===S.scope));
  document.querySelectorAll("#views button").forEach(b=>b.classList.toggle("on", b.dataset.v===P.vista));
  $("#sort").value = P.ordine;
  $("#sub").innerHTML = `<b>${res.length}</b> di <b>${base.length}</b>` + (S.q?` per «${esc(S.q)}»`:"");
  const cc = count(base,"categoria"), tc = count(base,"tipo"), gc = count(base,"etichette");
  $("#cats").innerHTML = `<button class="${!S.cat?"on":""}" data-cat=""><span class="nm">Tutte</span><span class="n">${base.length}</span></button>` +
    Object.keys(cc).sort((a,b)=>a.localeCompare(b,"it")).map(c=>`<button class="${S.cat===c?"on":""}" data-cat="${esc(c)}"><span class="nm"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</span><span class="n">${cc[c]}</span></button>`).join("");
  $("#types").innerHTML = Object.keys(TYPES).filter(k=>tc[k]).map(k=>`<button class="${S.type===k?"on":""}" data-type="${k}"><span class="nm">${icon("i-t-"+(k==="altro"?"txt":k))}${TYPES[k].l}</span><span class="n">${tc[k]}</span></button>`).join("");
  $("#tags").innerHTML = Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,24).map(([g])=>`<button class="chip ${S.tag===g?"on":""}" data-tag="${esc(g)}">${esc(g)}</button>`).join("");
  const grid = $("#grid");
  grid.className = "grid" + (P.vista==="lista"?" list":P.vista==="compatta"?" compact":"");
  grid.innerHTML = res.length ? res.map(card).join("") : emptyState(base.length);
  const pins = NOTES.filter(n=>n.preferita).sort(SORTS.recenti);
  $("#pinsec").hidden = !P.evidenza || !pins.length;
  $("#pins").innerHTML = pins.map(card).join("");
}
function greeting(){
  const h = new Date().getHours();
  return h < 6 ? "Buonanotte" : h < 13 ? "Buongiorno" : h < 18 ? "Buon pomeriggio" : "Buonasera";
}
function renderHero(){
  const hero = $("#hero");
  hero.hidden = !P.benvenuto && !P.statistiche;
  hero.style.gridTemplateColumns = P.benvenuto && P.statistiche ? "" : "minmax(0,1fr)";
  const weekAgo = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
  const week = NOTES.filter(n => n.data >= weekAgo).length;
  const rev = NOTES.filter(n => n.stato === "da rivedere").length;
  const plaud = NOTES.filter(n => n.tipo === "plaud").length;
  const team = NOTES.filter(n => n.sezione === "team").length;
  const today = new Date().toLocaleDateString("it-IT",{weekday:"long", day:"numeric", month:"long"});
  hero.innerHTML = (P.benvenuto ? `<div class="welcome">
      <div><div class="date">${esc(today)}</div>
      <h1>${greeting()}${P.nome?", "+esc(P.nome):""}</h1></div>
      <p>${rev ? `Hai <b>${rev}</b> ${rev===1?"nota da rivedere":"note da rivedere"}: l'AI non era sicura di categoria o etichette.` : "Tutte le note sono catalogate. Cerca, filtra o aggiungine una nuova."}</p>
      <div class="row"><button class="btn" data-act="ask">${icon("i-chat")}Chiedi all'archivio</button><button class="btn" data-act="new">${icon("i-plus")}Nuova nota</button>${rev?`<button class="btn" data-act="review">Rivedi ora</button>`:""}<button class="btn" data-act="custom">${icon("i-palette")}Personalizza</button></div>
    </div>` : "") + (P.statistiche ? `<div class="stats">
      <button class="stat" data-act="all"><span class="k">Note in archivio</span><span class="v">${NOTES.length}</span><span class="s">${NOTES.length - team} personali · ${team} condivise</span></button>
      <div class="stat"><span class="k">Ultimi 7 giorni</span><span class="v">${week}</span><span class="s">note aggiunte</span></div>
      <button class="stat" data-act="plaud"><span class="k">${icon("i-t-plaud")}Registrazioni Plaud</span><span class="v">${plaud}</span><span class="s">importate ogni mattina</span></button>
      <button class="stat ${rev?"warn":""}" data-act="review"><span class="k">Da rivedere</span><span class="v">${rev}</span><span class="s">${rev?"tocca per vederle":"nessuna"}</span></button>
    </div>` : "");
}
function emptyState(total){
  if (total) return `<div class="empty"><b>Nessun risultato</b>Prova a togliere un filtro o a cercare un'altra parola.</div>`;
  return `<div class="empty"><b>Sezione vuota</b>Crea una nota con «Nuova nota» oppure mettila nella cartella Drive
    «${S.scope==="team"?"Notabene Condivise":"Notabene Personale"}» e premi Aggiorna.</div>`;
}
function card(n){
  const T = TYPES[n.tipo] || TYPES.altro;
  const hit = S.hits[n.id] ? `<div class="snippet">${hl(S.hits[n.id])}</div>` : "";
  const st = n.stato==="da rivedere"?'<span class="pill rev">Da rivedere</span>':n.stato==="confermata"?'<span class="pill ok">Confermata</span>':'<span class="pill ai">AI</span>';
  const picked = S.sel && S.sel.has(n.id);
  return `<article class="card ${P.schedeColorate?"tinted":""} ${S.sel?"selecting":""} ${picked?"picked":""}" style="--band:${noteColor(n)}" data-open="${esc(n.id)}" tabindex="0">
    ${S.sel?`<span class="tick" aria-hidden="true">${picked?icon("i-check"):""}</span>`:""}
    <div class="meta"><span class="type">${icon("i-t-"+(n.tipo==="altro"?"txt":n.tipo))}${T.l}</span><span>${fmtD(n.data)}</span></div>
    <button class="star ${n.preferita?"on":""}" data-star="${esc(n.id)}" aria-label="${n.preferita?"Togli dall'evidenza":"Metti in evidenza"}">${icon("i-star")}</button>
    <h4>${hl(n.titolo)}</h4>
    <p>${hl(n.riassunto)}</p>${hit}
    <div class="tags">${n.etichette.slice(0,5).map(g=>`<span class="tag">${hl(g)}</span>`).join("")}</div>
    <div class="foot"><span class="vis">${icon(n.sezione==="team"?"i-share":"i-lock")}<span class="dot" style="background:${catColor(n.categoria)}"></span>${esc(n.categoria)}</span>${st}</div>
  </article>`;
}

/* ---------- Nota aperta ---------- */
function openNote(id){
  const n = NOTES.find(x=>x.id===id); if(!n) return; S.open=id;
  const T = TYPES[n.tipo] || TYPES.altro;
  const cats = Object.keys(count(NOTES,"categoria")).sort();
  $("#layer").innerHTML = `<div class="scrim" data-close></div>
  <section class="drawer" role="dialog" aria-label="${esc(n.titolo)}" style="--band:${noteColor(n)}">
    <div class="band"></div>
    <div class="dh"><span class="type" style="font-family:var(--mono);font-size:12px">${icon("i-t-"+(n.tipo==="altro"?"txt":n.tipo))}${T.l} · ${fmtD(n.data)}</span>
      <div style="display:flex;gap:4px"><button class="btn icon ghost star ${n.preferita?"on":""}" style="position:static" data-star="${esc(n.id)}" aria-label="In evidenza">${icon("i-star")}</button>
      <button class="btn icon ghost" data-close aria-label="Chiudi">${icon("i-close")}</button></div></div>
    <div class="db">
      <input class="ttl" id="ttl" value="${esc(n.titolo)}" aria-label="Titolo">
      <div class="box"><div class="lbl5">Riassunto ${n.stato==="da rivedere"?'<span class="pill rev">Da rivedere</span>':""}</div><div>${hl(n.riassunto)}</div></div>
      <div><div class="lbl5">Etichette</div>
        <div class="tags tagedit">${n.etichette.map(g=>`<span class="tag">${esc(g)}<button data-rmtag="${esc(g)}" aria-label="Rimuovi ${esc(g)}">×</button></span>`).join("")}
        <input class="addtag" id="addtag" placeholder="+ etichetta, Invio"></div></div>
      <label class="field"><span>Categoria</span>

    <h2>Nuova nota</h2>
    <div class="seg" id="upmode"><button data-m="file" class="on">Carica file</button><button data-m="scrivi">Scrivi</button></div>

      <div style="font-size:13px">Documenti, PDF, foto, audio. Massimo 20 MB per file.</div></div>
      <ul class="uplist" id="uplist" hidden></ul></div>
    <div id="m-scrivi" hidden style="display:flex;flex-direction:column;gap:10px">
      <input class="input" id="wtitle" placeholder="Titolo (facoltativo)">
      <textarea class="input" id="wtext" placeholder="Scrivi la nota. L'AI la catalogherà da sola."></textarea>
      <button class="btn primary" id="wsave" style="align-self:flex-end">Salva nota</button></div>
    <div class="radio">
      <label><input type="radio" name="v" value="mie" ${S.scope!=="team"?"checked":""}> <span>Personale<small>La vedi solo tu</small></span></label>
      <label><input type="radio" name="v" value="team" ${S.scope==="team"?"checked":""}> <span>Condivisa<small>La vede tutto il team</small></span></label>
    </div>
    <p id="upmsg" style="margin:0;color:var(--muted)" hidden>Salvataggio su Drive, lettura del testo e catalogazione con l'AI…</p>
    <div style="display:flex;justify-content:flex-end"><button class="btn ghost" data-close>Annulla</button></div>
  </div></div>`;
  $("#m-scrivi").hidden = true;
  const f=$("#file"), d=$("#drop");
  $("#upmode").onclick = e => { const b=e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#upmode button").forEach(x=>x.classList.toggle("on", x===b));
    $("#m-file").hidden = b.dataset.m!=="file"; $("#m-scrivi").hidden = b.dataset.m!=="scrivi"; if(b.dataset.m==="scrivi") $("#wtext").focus(); };
  $("#pick").onclick=()=>f.click();
  f.onchange=()=>f.files.length&&sendFiles([...f.files]);
  d.ondragover=e=>{e.preventDefault();d.classList.add("over")};
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over");e.dataTransfer.files.length&&sendFiles([...e.dataTransfer.files])};
  $("#wsave").onclick=()=>{
    const text=$("#wtext").value.trim(); if(!text) return toast("Scrivi qualcosa prima di salvare.");
    const title=($("#wtitle").value.trim() || text.split("\n")[0].slice(0,60)).replace(/[\\/:*?"<>|]/g,"-");
    const bytes = new TextEncoder().encode(text); let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
    sendData(title + ".txt", "text/plain", btoa(bin));
  };
}
function scopeChoice(){ return document.querySelector('input[name="v"]:checked').value; }
function readB64(file){
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => ko(new Error("Non riesco a leggere " + file.name)); r.readAsDataURL(file); });
}
/** Un file: caricato e catalogato subito. Più file: caricati uno alla volta, poi catalogati con la sincronizzazione. */
async function sendFiles(files){
  if (files.length === 1) return sendFile(files[0]);
  const scope = scopeChoice();
  const list = $("#uplist"); list.hidden = false; $("#drop").hidden = true; $("#upmode").hidden = true;
  list.innerHTML = files.map((f,i)=>`<li id="up${i}"><span class="nm">${esc(f.name)}</span><span class="st">In attesa</span></li>`).join("");
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const li = $("#up"+i), st = li.querySelector(".st");
    if (files[i].size > 20*1024*1024) { st.textContent = "Troppo grande (oltre 20 MB)"; li.className = "err"; continue; }
    st.textContent = "Caricamento…"; li.className = "run";
    try { await api("uploadRaw", files[i].name, files[i].type, await readB64(files[i]), scope); st.textContent = "Caricato"; li.className = "done"; ok++; }
    catch(e){ st.textContent = String(e.message || e); li.className = "err"; }
  }
  $("#upmsg").hidden = false;
  $("#upmsg").textContent = `${ok} file su ${files.length} caricati. Ora l'AI li cataloga: può richiedere qualche minuto.`;
  S.scope = scope; S.cat = S.type = S.tag = null;
  await catalogAll();
}
async function catalogAll(){
  for (let round = 0; round < 12; round++) {
    let r; try { r = await api("syncNow"); } catch(e){ fail(e); break; }
    if (r.restanti < 0) { await new Promise(res=>setTimeout(res, 15000)); continue; }
    const msg = $("#upmsg"); if (msg) msg.textContent = r.restanti ? `Catalogate ${r.fatti} note, ne restano ${r.restanti}…` : "Catalogazione completata.";
    if (!r.restanti) break;
  }
  await load(); toast("Caricamento massivo completato");
}
function sendFile(file){
  if (file.size > 20*1024*1024) return toast("Il file supera 20 MB: caricalo direttamente nella cartella Drive.");
  const r = new FileReader();
  r.onload = () => sendData(file.name, file.type, String(r.result).split(",")[1]);
  r.readAsDataURL(file);
}
async function sendData(name, type, b64){
  const scope = scopeChoice();
  $("#upmsg").hidden = false;
  try {
    const n = await api("uploadNote", name, type, b64, scope);
    NOTES.unshift(n); S.scope = scope; S.cat=S.type=S.tag=null;
    closeLayer(); render(); toast("Nota salvata e catalogata"); openNote(n.id);
  } catch(e){ $("#upmsg").hidden = true; fail(e); }
}

const SUGGEST = ["Cosa si è deciso nell'ultima riunione?", "Quali scadenze ci sono questo mese?", "Riassumi le note sugli incentivi", "Chi ha parlato di ferie estive?"];

  S.open = null;

      <button class="btn primary icon" aria-label="Invia">${icon("i-send")}</button></form>
  </section>`;
  const q = $("#chatq"); q.focus();
  if (first) ask(first);
}
function chatLog(){
  if (!S.chat.length) return `<div class="chatempty"><p>Chiedi qualsiasi cosa: l'AI cerca nelle note e dentro i file su Drive, legge quelli pertinenti, risponde e ti indica le fonti. Una ricerca approfondita può richiedere fino a un minuto.</p>
    <div class="chips">${SUGGEST.map(s=>`<button class="chip" data-suggest="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
  return S.chat.map(m => m.ruolo === "utente" ? `<div class="msg me">${esc(m.testo)}</div>` :
    m.attesa ? `<div class="msg ai wait">Cerco nelle note e dentro i file su Drive…</div>` :
    `<div class="msg ai">${fmtAnswer(m.testo, m.fonti)}${m.fonti && m.fonti.length ? `<div class="sources">${m.fonti.filter(f=>f.citata).concat(m.fonti.filter(f=>!f.citata)).slice(0,8).map(f=>NOTES.some(x=>x.id===f.id) ? `<button class="src ${f.citata?"cited":""}" data-src="${esc(f.id)}"><b>${f.n}</b>${esc(f.titolo)}</button>` : `<a class="src ${f.citata?"cited":""}" href="${esc(f.url)}" target="_blank" rel="noopener"><b>${f.n}</b>${esc(f.titolo)} ↗</a>`).join("")}</div>` : ""}</div>`).join("");
}
function fmtAnswer(t, fonti){
  let s = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  return s.replace(/\[(\d+)\]/g, (m, n) => { const f = (fonti||[]).find(x=>x.n===Number(n)); if (!f) return m; return NOTES.some(x=>x.id===f.id) ? `<button class="cite" data-src="${esc(f.id)}" title="${esc(f.titolo)}">${n}</button>` : `<a class="cite" href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.titolo)}">${n}</a>`; });
}
async function ask(question){
  question = question.trim(); if (!question) return;
  const history = S.chat.filter(m=>!m.attesa).map(m=>({ruolo:m.ruolo, testo:m.testo}));
  S.chat.push({ruolo:"utente", testo:question}, {ruolo:"ai", attesa:true});
  const log = $("#chatlog"); if (log) { log.innerHTML = chatLog(); log.scrollTop = log.scrollHeight; }
  try {
    const r = await api("askArchive", question, history, {ovunque: !!S.ovunque});
    S.chat[S.chat.length-1] = {ruolo:"ai", testo:r.risposta, fonti:r.fonti};
  } catch(e){
    S.chat[S.chat.length-1] = {ruolo:"ai", testo:"Non sono riuscito a rispondere: " + (e.message || e), fonti:[]};
  }
  const log2 = $("#chatlog"); if (log2) { log2.innerHTML = chatLog(); log2.scrollTop = log2.scrollHeight; }
}

/* ---------- Selezione multipla ---------- */
function setSelecting(on){
  S.sel = on ? new Set() : null;
  $("#selbar").hidden = !on; $("#selbtn").classList.toggle("on", on);
  updateSelbar(); render();
}
function updateSelbar(){ if (S.sel) $("#selcount").textContent = S.sel.size + (S.sel.size===1?" selezionata":" selezionate"); }
async function bulk(action){
  const ids = [...S.sel]; if (!ids.length) return toast("Seleziona prima qualche nota.");
  if (action === "del" && !$("#selbar").dataset.confirm) {
    $("#selbar").dataset.confirm = "1";
    $("#selcount").textContent = `Eliminare ${ids.length} note? Vanno nel cestino di Drive (recuperabili per 30 giorni). Premi di nuovo Elimina per confermare.`;
    return;
  }
  delete $("#selbar").dataset.confirm;
  let ok = 0, ko = 0;
  for (const id of ids) {
    const n = NOTES.find(x=>x.id===id); if (!n) continue;
    $("#selcount").textContent = `Elaborazione ${ok+ko+1} di ${ids.length}…`;
    try {
      if (action === "del") { await api("deleteNote", id); NOTES = NOTES.filter(x=>x.id!==id); }
      else if (n.sezione !== action) { await api("moveNote", id, action); n.sezione = action; }
      ok++;
    } catch(e){ ko++; }
  }
  toast(`${ok} note ${action==="del"?"eliminate":"spostate"}` + (ko?`, ${ko} non riuscite (file di altre persone o errori)`:""));
  setSelecting(false);
}

});
function onCards(e){
  if (S.sel) { const c=e.target.closest("[data-open]"); if(!c) return; const id=c.dataset.open;
    S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); delete $("#selbar").dataset.confirm; updateSelbar(); render(); return; }
  const st=e.target.closest("[data-star]"); if(st){ e.stopPropagation(); return toggleStar(st.dataset.star); }
  const c=e.target.closest("[data-open]"); if(c) openNote(c.dataset.open);
}
$("#grid").addEventListener("click",onCards);
$("#pins").addEventListener("click",onCards);
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches && e.target.matches(".card")) openNote(e.target.dataset.open); });
$("#hero").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="new") upload();
  if(a==="ask") openChat();
  if(a==="custom") openCustom();
  if(a==="all"){ S.scope="tutte"; S.cat=S.type=S.tag=null; render(); }
  if(a==="plaud"){ S.scope="tutte"; S.cat=S.tag=null; S.type="plaud"; render(); $("#grid").scrollIntoView({behavior:"smooth"}); }
  if(a==="review"){ S.scope="tutte"; S.cat=S.type=S.tag=null; S.q=""; $("#q").value=""; P.ordine="recenti"; render();
    const first = NOTES.find(n=>n.stato==="da rivedere"); if(first) openNote(first.id); }
});
$("#up").onclick=upload;
$("#ask").onclick=()=>{ const q = S.q.trim().length > 2 ? S.q : ""; if (q) { $("#q").value=""; S.q=""; S.hits={}; render(); } openChat(q); };
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter" && S.q.trim().length > 2){ e.preventDefault(); const q=S.q; e.target.value=""; S.q=""; S.hits={}; render(); openChat(q); } });
$("#selbtn").onclick=()=>setSelecting(!S.sel);
$("#selbar").addEventListener("click",e=>{ const b=e.target.closest("[data-sel]"); if(!b) return; const a=b.dataset.sel;
  if(a==="exit") return setSelecting(false);
  if(a==="all"){ NOTES.filter(inScope).filter(matches).forEach(n=>S.sel.add(n.id)); updateSelbar(); return render(); }
  if(a!=="del") delete $("#selbar").dataset.confirm;
  bulk(a); });
$("#custom").onclick=openCustom;
$("#sync").onclick=async()=>{
  const b=$("#sync"); b.disabled=true; toast("Aggiornamento in corso…");
  try { const r = await api("syncNow"); toast(r.restanti<0 ? r.messaggio : `${r.fatti} note catalogate` + (r.restanti?`, ${r.restanti} in attesa: premi di nuovo`:"")); await load(); }
  catch(e){ fail(e); } finally { b.disabled=false; }
};
$("#mf").onclick=()=>{const o=$("#side").classList.toggle("open"); $("#mf").setAttribute("aria-expanded",o);};
$("#av").onclick=()=>{
  const m=$("#menu"); m.hidden=!m.hidden;
  m.innerHTML=`<div class="lbl">Connesso come</div><div style="padding:2px 10px 8px;font-weight:600;overflow-wrap:anywhere">${esc(ME)}</div>
  <button data-m="custom">${icon("i-palette")}Personalizza</button><button data-m="sync">${icon("i-sync")}Aggiorna dalle cartelle</button>
  <div class="lbl">Per cambiare account usa il menu di Google</div>`;
};
$("#menu").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; $("#menu").hidden=true; if(b.dataset.m==="custom") openCustom(); if(b.dataset.m==="sync") $("#sync").click(); });
document.addEventListener("click",e=>{ if(!e.target.closest("#menu,#av")) $("#menu").hidden=true; });

$("#layer").addEventListener("click",async e=>{
  if(e.target.closest("[data-close]")) return closeLayer();
  // Chat
  const sug = e.target.closest("[data-suggest]"); if (sug) return ask(sug.dataset.suggest);
  const src = e.target.closest("[data-src]"); if (src) { if (NOTES.some(x=>x.id===src.dataset.src)) openNote(src.dataset.src); else toast("Nota non trovata: premi Aggiorna."); return; }
  if (e.target.closest("[data-newchat]")) { S.chat = []; return openChat(); }
  // Personalizza
  const pc = e.target.closest("[data-pref] [data-v]");
  if (pc) { const key = pc.closest("[data-pref]").dataset.pref; const v = pc.dataset.v; P[key] = key==="testo" ? Number(v) : v; savePrefs(); render(); return openCustom(); }
  const cc = e.target.closest("[data-catcol] [data-v]");
  if (cc) { P.catColors = Object.assign({}, P.catColors, {[cc.closest("[data-catcol]").dataset.catcol]: Number(cc.dataset.v)}); savePrefs(); render(); return openCustom(); }
  if (e.target.closest("[data-savekey]")) { const b = e.target.closest("[data-savekey]"); b.disabled = true; b.textContent = "Verifica…";
    try { await api("setApiKey", $("#newkey").value); BOOT.aiEnabled = true; banner(); $("#newkey").value = ""; toast("Chiave verificata e salvata"); }
    catch(err){ fail(err); } finally { b.disabled = false; b.textContent = "Verifica e salva"; } return; }
  if (e.target.closest("[data-reset]")) { P = Object.assign({}, DEFAULTS, {nome:P.nome}); savePrefs(); render(); toast("Impostazioni ripristinate"); return openCustom(); }
  // Nota
  const n=NOTES.find(x=>x.id===S.open); if(!n) return;
  const st=e.target.closest("[data-star]"); if(st) return toggleStar(n.id);
  if(e.target.closest("[data-askdel]")){ $("#delconfirm").hidden = false; return; }
  if(e.target.closest("[data-nodel]")){ $("#delconfirm").hidden = true; return; }
  if(e.target.closest("[data-del]")){
    try { await api("deleteNote", n.id); NOTES = NOTES.filter(x=>x.id!==n.id); closeLayer(); render(); toast("Nota spostata nel cestino di Drive"); } catch(err){ fail(err); }
    return; }
  if(e.target.closest("[data-edit]")) return startEdit(n);
  if(e.target.closest("[data-canceledit]")) return openNote(n.id);
  if(e.target.closest("[data-savetext]")){ const b=e.target.closest("[data-savetext]"); b.disabled=true; b.textContent="Salvataggio e catalogazione…";
    try { replaceNote(await api("saveNoteText", n.id, $("#edtext").value)); toast("Salvato su Drive"); } catch(err){ b.disabled=false; b.textContent="Salva su Drive"; fail(err); }
    return; }
  if(e.target.closest("[data-replace]")){ $("#repfile").click(); return; }
  const nc=e.target.closest("[data-ncol]");
  if(nc){ n.colore = nc.dataset.ncol===""?"":Number(nc.dataset.ncol); render(); openNote(n.id); save(n,{colore:n.colore}); return; }
  const rm=e.target.closest("[data-rmtag]");
  if(rm){ n.etichette=n.etichette.filter(g=>g!==rm.dataset.rmtag); render(); openNote(n.id); save(n,{etichette:n.etichette}); }
  if(e.target.closest("[data-ok]")){ n.stato="confermata"; render(); openNote(n.id); save(n,{conferma:true, etichette:n.etichette, categoria:n.categoria}); toast("Catalogazione confermata"); }
  if(e.target.closest("[data-text]")){ $("#full").textContent="Caricamento…"; try { $("#full").textContent = (await api("getNoteText", n.id)) || "Nessun testo estratto."; } catch(err){ fail(err); } }
  if(e.target.closest("[data-move]")){
    const to = n.sezione==="team"?"mie":"team";
    try { await api("moveNote", n.id, to); n.sezione=to; render(); openNote(n.id); toast(to==="team"?"Ora la vede tutto il team":"Ora la vedi solo tu"); } catch(err){ fail(err); }
  }
});
$("#layer").addEventListener("submit",e=>{ if(e.target.id==="chatform"){ e.preventDefault(); const q=$("#chatq"); const v=q.value; q.value=""; ask(v); } });
$("#layer").addEventListener("change",async e=>{
  if (e.target.id==="ovunque") { S.ovunque = e.target.checked; return; }
  if (e.target.id==="repfile" && e.target.files[0]) { const f=e.target.files[0]; const n=NOTES.find(x=>x.id===S.open); if(!n) return;
    if (f.size > 20*1024*1024) return toast("Il file supera 20 MB.");
    toast("Sostituzione e catalogazione in corso…");
    try { replaceNote(await api("replaceFile", n.id, f.name, f.type, await readB64(f))); toast("File sostituito su Drive"); } catch(err){ fail(err); }
    return; }
  if (e.target.matches("[data-tog]")) { P[e.target.dataset.tog] = e.target.checked; savePrefs(); render(); return; }
  if (e.target.id==="pnome") { P.nome = e.target.value.trim(); savePrefs(); $("#av").textContent=(P.nome||ME).slice(0,2).toUpperCase(); render(); toast("Nome salvato"); return; }
  const n=NOTES.find(x=>x.id===S.open); if(!n) return;
  if (e.target.id==="ttl") { const v=e.target.value.trim(); if(v && v!==n.titolo){ n.titolo=v; render(); save(n,{titolo:v}); toast("Titolo aggiornato"); } }
  if (e.target.id==="cat") { const v=e.target.value.trim(); if(v && v!==n.categoria){ n.categoria=v; render(); openNote(n.id); save(n,{categoria:v}); toast("Categoria aggiornata"); } }
});
$("#layer").addEventListener("keydown",e=>{
  if(e.target.id==="chatq" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("#chatform").requestSubmit(); return; }
  const n=NOTES.find(x=>x.id===S.open);
  if(e.key==="Enter" && (e.target.id==="ttl"||e.target.id==="cat"||e.target.id==="pnome")) { e.target.blur(); return; }
  if(n && e.target.id==="addtag" && e.key==="Enter"){ const v=e.target.value.trim().toLowerCase();
    if(v && !n.etichette.includes(v)){ n.etichette.push(v); render(); openNote(n.id); save(n,{etichette:n.etichette}); setTimeout(()=>$("#addtag")?.focus(),0);} }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(S.sel && !S.open && !$("#layer").innerHTML) setSelecting(false); closeLayer(); } if(e.key==="/" && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); } });

try { const saved = JSON.parse(store("nb-prefs") || "null"); if (saved) P = Object.assign({}, DEFAULTS, saved); } catch(e){}
S.scope = P.sezione;
applyPrefs();
load();
</script>
</body>
</html>
